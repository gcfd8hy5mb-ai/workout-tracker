<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003b49">
<title>MYLIFTCOACH</title>
<style>
html,body{margin:0;min-height:100%;background:#003b49;color:#fff9ec;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{min-height:100dvh;display:grid;place-content:center;text-align:center;padding:24px;background:linear-gradient(#003b49cc,#002632ed),url("images/luxury-login-stone.webp") center/cover}
h1{font:400 clamp(28px,8vw,44px) Georgia,serif;margin:0 0 14px}
a{display:inline-block;margin-top:20px;padding:16px 24px;color:white;background:#006b78;border:1px solid #c7a66f;border-radius:14px;font-weight:700;text-decoration:none}
</style>
<script>
(function(){
  // The full MYLIFTCOACH app owns authentication and scoped storage.
  // Never authenticate on a separate document and hand sessions across pages.
  var next=new URL('app.html',location.href);
  next.search=location.search;
  location.replace(next.href);
})();
</script>
</head>
<body><main><h1>MYLIFTCOACH</h1><p>Opening your secure training account…</p><a id="continue" href="app.html">Open MYLIFTCOACH</a></main>
<script>document.getElementById('continue').href=new URL('app.html'+location.search,location.href).href;</script>
</body></html>
