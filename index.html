<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Workout">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="images/app-icon.png">

<title>Workout Tracker</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{

--bg:#f2f2f7;--card:#fff;--text:#111;--sub:#6e6e73;

--line:#e5e5ea;--green:#28a745;--red:#dc3545;

--blue:#007aff;--orange:#ff9500;
--header-height:92px;--bottom-nav-height:63px

}

html{background:var(--bg);overscroll-behavior-y:none}

body{

margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;

background:var(--bg);color:var(--text);

padding-top:calc(var(--header-height) + env(safe-area-inset-top));
padding-bottom:calc(var(--bottom-nav-height) + 25px + env(safe-area-inset-bottom));
overscroll-behavior-y:none

}

header{

background:#111;color:white;

position:fixed;top:0;left:0;right:0;z-index:5000;
height:calc(var(--header-height) + env(safe-area-inset-top));
padding:calc(18px + env(safe-area-inset-top)) 18px 18px;
text-align:center;contain:layout paint;transform:none

}

header h1{margin:0;font-size:28px}

header p{margin:5px 0 0;color:#aaa;font-size:14px}

.container{max-width:750px;margin:auto;padding:16px}

.hidden{display:none!important}

.card{

background:white;border-radius:18px;padding:16px;margin-bottom:14px;

box-shadow:0 2px 8px rgba(0,0,0,.07)

}

.small{color:var(--sub);font-size:13px}

.section-heading{margin:24px 2px 12px;font-size:20px}

.back{

border:0;background:transparent;color:var(--blue);

font-size:17px;font-weight:650;padding:5px 0 14px

}

button{
font-family:inherit;transition:transform .14s ease,filter .14s ease,background-color .18s ease,
color .18s ease,box-shadow .18s ease
}

button:active{transform:scale(.99);filter:brightness(.97)}

button:focus-visible{outline:3px solid rgba(0,122,255,.35);outline-offset:2px}

.day-button,.action-button{

width:100%;border:0;background:white;border-radius:17px;

padding:18px;margin-bottom:12px;text-align:left;

font-size:18px;font-weight:750;

box-shadow:0 2px 8px rgba(0,0,0,.07)

}

.day-button span,.action-button span{

display:block;color:var(--sub);font-size:14px;font-weight:400;margin-top:5px

}

.primary{background:#111;color:white}

.primary span{color:#ccc}

.progress-bar{

height:10px;background:#ddd;border-radius:10px;

overflow:hidden;margin-top:10px

}

.progress-fill{height:100%;width:0;background:#111;transition:width .22s ease}

.exercise{

background:white;border-radius:18px;overflow:hidden;

margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.07)

}

.exercise-header{padding:16px}

.exercise-title{font-size:19px;font-weight:750}

.muscle{

display:inline-block;background:#eee;color:#555;padding:5px 9px;

border-radius:8px;font-size:13px;margin-top:7px

}

.details{display:none;border-top:1px solid var(--line);padding:0 16px 18px}

.details.open{display:block}

.exercise-image{

width:100%;max-height:350px;object-fit:contain;background:#eee;

border-radius:14px;margin-top:16px

}

.image-placeholder{

width:100%;min-height:190px;background:#eee;border-radius:14px;

margin-top:16px;display:flex;justify-content:center;align-items:center;

text-align:center;color:#777;padding:20px

}

.detail-title{font-weight:750;margin:18px 0 7px}

.details p,.details li{color:#444;line-height:1.5;font-size:15px}

.details ul{padding-left:20px}

.tracking{background:#f7f7f9;padding:13px;border-radius:14px;margin-top:17px}

.set-block{padding:12px 0;border-bottom:1px solid #ddd}

.set-block:last-of-type{border-bottom:0}

.set-row{

display:grid;grid-template-columns:48px 1fr 1fr;

gap:8px;align-items:center

}

.set-label{font-weight:700;font-size:14px}

.picker-button{

border:1px solid #ccc;background:white;border-radius:11px;

padding:12px 6px;font-size:15px;font-weight:650;min-height:46px

}

.previous{margin:7px 0 0 56px;font-size:12px;color:#777}

.compare{

display:inline-block;margin:7px 0 0 56px;padding:5px 8px;

border-radius:8px;font-size:12px;font-weight:750

}

.compare.beat{background:#dff5e5;color:#137333}

.compare.match{background:#e8f0fe;color:#174ea6}

.compare.below{background:#fde7e9;color:#b3261e}

.compare.new{background:#eee;color:#555}

.workout-complete{

width:100%;border:0;background:#111;color:white;border-radius:11px;

padding:14px;font-weight:700;font-size:15px;margin:4px 0 12px

}

.workout-complete.done{background:var(--green)}

.finish-workout{

width:100%;border:0;border-radius:15px;padding:17px;

background:var(--green);color:white;font-size:17px;

font-weight:800;margin:5px 0 20px

}

input,select{

width:100%;padding:13px;border:1px solid #ccc;

border-radius:11px;background:white;font-size:16px

}

label{display:block;font-weight:650;margin:14px 0 6px}

.library-item{

display:flex;justify-content:space-between;align-items:center;

gap:10px;border-bottom:1px solid var(--line);padding:13px 0

}

.library-item:last-child{border-bottom:0}

.library-name{font-weight:700}

.add-small{

border:0;background:#111;color:white;padding:9px 13px;

border-radius:9px;font-weight:700;white-space:nowrap

}

.remove-small{

border:0;background:#eee;padding:8px 11px;border-radius:9px;font-weight:650

}

.save-button{

width:100%;border:0;background:#111;color:white;padding:15px;

border-radius:12px;font-size:16px;font-weight:750;margin-top:15px

}

.delete-button{

width:100%;border:0;background:white;color:var(--red);

padding:13px;border-radius:12px;font-weight:700;margin-top:8px

}

.search{margin-bottom:10px}

.builder-list{margin-top:10px}

.builder-exercise{

background:#f4f4f6;border-radius:12px;padding:12px;margin-bottom:8px

}

.builder-exercise strong{display:block;margin-bottom:3px}

.badge{display:inline-block;font-size:12px;color:#666}

.empty{color:#777;text-align:center;padding:20px}

/* WORKOUT TABS */

.workout-tabs{

display:grid;grid-template-columns:repeat(3,1fr);

background:white;border-radius:15px;padding:5px;

margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)

}

.workout-tab{

border:0;background:transparent;padding:10px 3px;border-radius:11px;

font-size:12px;font-weight:700;color:#777

}

.workout-tab.active{background:#111;color:white}

/* HISTORY */

.history-card{

background:white;border-radius:17px;padding:16px;margin-bottom:12px;

box-shadow:0 2px 8px rgba(0,0,0,.06)

}

.history-title{font-size:17px;font-weight:750}

.history-date{color:#777;font-size:13px;margin-top:4px}

.history-exercise{

padding:12px 0;border-top:1px solid var(--line);margin-top:10px

}

.history-set{font-size:14px;color:#555;margin-top:4px}

/* PROGRESS */

.stat-grid{

display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px

}

.stat-card{

background:white;border-radius:16px;padding:16px;

box-shadow:0 2px 8px rgba(0,0,0,.06)

}

.stat-number{font-size:26px;font-weight:800}

.stat-label{font-size:12px;color:#777;margin-top:3px}

.progress-exercise{

background:white;border-radius:16px;padding:15px;margin-bottom:10px;

box-shadow:0 2px 8px rgba(0,0,0,.06)

}

.progress-name{font-weight:750}

.progress-detail{font-size:13px;color:#666;margin-top:5px}

/* TIMER */

.timer-card{text-align:center;padding:25px 16px}

.timer-display{

font-size:58px;font-weight:800;font-variant-numeric:tabular-nums;

margin:15px 0 22px

}

.timer-presets{

display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px

}

.timer-button{

border:0;background:#eee;border-radius:12px;padding:13px 5px;

font-weight:750;font-size:14px

}

.timer-start{

width:100%;border:0;background:#111;color:white;border-radius:13px;

padding:15px;font-size:17px;font-weight:750;margin-top:8px

}

.timer-reset{

width:100%;border:0;background:#eee;border-radius:13px;

padding:13px;font-size:15px;font-weight:700;margin-top:8px

}

/* BOTTOM NAV */

.bottom-nav{

position:fixed;left:0;right:0;bottom:0;

background:rgba(255,255,255,.96);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border-top:1px solid #ddd;

display:grid;grid-template-columns:repeat(5,1fr);

min-height:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom));
padding:7px 4px calc(7px + env(safe-area-inset-bottom));
z-index:5000;contain:layout paint;transform:none

}

.nav-button{

border:0;background:transparent;color:#777;

font-size:10px;font-weight:700;line-height:12px;padding:3px 0;
min-width:0;min-height:48px;touch-action:manipulation;
transition:color .12s ease-out;transform:none;filter:none

}

.nav-icon{display:block;height:24px;font-size:22px;line-height:24px;margin-bottom:2px}

.nav-button.active{color:#111}

.nav-button:active{color:var(--blue);transform:none;filter:none}

.nav-button:focus-visible{outline:2px solid rgba(0,122,255,.45);outline-offset:-2px}

/* PICKER */

.picker-overlay{

position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9998

}

.picker-sheet{

position:fixed;left:0;right:0;bottom:0;background:#f8f8f8;

border-radius:22px 22px 0 0;z-index:9999;

padding-bottom:calc(12px + env(safe-area-inset-bottom));

box-shadow:0 -8px 30px rgba(0,0,0,.18)

}

.picker-toolbar{

display:flex;justify-content:space-between;align-items:center;

padding:14px 18px;background:white;border-radius:22px 22px 0 0;

border-bottom:1px solid #ddd

}

.picker-toolbar strong{font-size:17px}

.picker-done{

border:0;background:transparent;color:var(--blue);

font-size:17px;font-weight:700

}

.wheel-wrap{position:relative;height:260px;overflow:hidden;background:#f8f8f8}

.wheel{

height:260px;overflow-y:scroll;scroll-snap-type:y mandatory;

-webkit-overflow-scrolling:touch;padding:104px 0

}

.wheel::-webkit-scrollbar{display:none}

.wheel-option{

height:52px;display:flex;align-items:center;justify-content:center;

scroll-snap-align:center;font-size:24px;font-weight:600

}

.wheel-highlight{

pointer-events:none;position:absolute;top:104px;left:18px;right:18px;

height:52px;border-top:1px solid #bbb;border-bottom:1px solid #bbb

}

@media(max-width:390px){

.set-row{grid-template-columns:42px 1fr 1fr}

.previous,.compare{margin-left:50px}

}

@media(prefers-reduced-motion:reduce){

button,.progress-fill{transition:none}

}

</style>

</head>

<body>

<header>

<h1>Workout Tracker</h1>

<p>Version 6.0</p>

</header>

<div class="container">

<section id="home">

<div class="card">

<strong>Workout Progress</strong>

<div class="small" id="progressText"></div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

</div>

<button class="action-button primary" onclick="showBuilder()">

＋ Create Your Own Workout

<span>Build a workout using the exercise library</span>

</button>

<button class="action-button" onclick="showLibrary()">

Exercise Library

<span>Browse exercises and instructions</span>

</button>

<h2 class="section-heading">Preset Workouts</h2>

<div id="presetButtons"></div>

<h2 class="section-heading">My Workouts</h2>

<div id="customButtons"></div>

</section>

<section id="workoutScreen" class="hidden">

<button class="back" onclick="goHome()">← Back</button>

<h2 id="workoutTitle"></h2>

<div class="workout-tabs">

<button class="workout-tab active" id="tabWorkout" onclick="showWorkoutTab('workout')">🏋️<br>Workout</button>

<button class="workout-tab" id="tabHistory" onclick="showWorkoutTab('history')">🕘<br>History</button>

<button class="workout-tab" id="tabTimer" onclick="showWorkoutTab('timer')">⏱️<br>Timer</button>

</div>

<div id="workoutTabContent">

<div id="exerciseList"></div>

<button id="completeWorkoutButton" class="workout-complete" onclick="toggleWorkoutComplete()">
Mark Workout Complete
</button>

<button id="finishWorkoutButton" class="finish-workout" onclick="finishWorkout()">Finish Workout</button>

</div>

<div id="workoutHistoryContent" class="hidden"></div>

<div id="workoutTimerContent" class="hidden"></div>

</section>

<section id="libraryScreen" class="hidden">

<button class="back" onclick="goHome()">← Back</button>

<h2>Exercise Library</h2>

<input id="librarySearch" class="search" type="search"

placeholder="Search exercises..." oninput="renderLibrary()">

<select id="muscleFilter" onchange="renderLibrary()">

<option value="All">All Muscle Groups</option>

<option>Chest</option><option>Back</option><option>Shoulders</option>

<option>Biceps</option><option>Triceps</option><option>Quads</option>

<option>Hamstrings</option><option>Glutes</option><option>Calves</option>

<option>Core</option>

</select>

<div class="card" id="libraryList"></div>

</section>

<section id="builderScreen" class="hidden">

<button class="back" onclick="goHome()">← Cancel</button>

<h2>Create Workout</h2>

<div class="card">

<label>Workout Name</label>

<input id="customWorkoutName" placeholder="Example: Monday Push Day">

<div class="detail-title">Exercises Added</div>

<div id="builderExercises" class="builder-list"></div>

</div>

<h3>Choose Exercises</h3>

<input id="builderSearch" class="search" type="search"

placeholder="Search exercise library..." oninput="renderBuilderLibrary()">

<div class="card" id="builderLibrary"></div>

<button class="save-button" onclick="saveCustomWorkout()">Save Workout</button>

</section>

<section id="overallProgressScreen" class="hidden">

<h2>Overall Progress</h2>

<div id="overallStats"></div>

<div id="overallExerciseProgress"></div>

</section>

<section id="globalHistoryScreen" class="hidden">

<h2>Workout History</h2>

<div id="globalHistoryList"></div>

</section>

<section id="globalTimerScreen" class="hidden">

<h2>Rest Timer</h2>

<div id="globalTimerContent"></div>

</section>

</div>

<nav class="bottom-nav" aria-label="Primary navigation">

<button class="nav-button active" id="navHome" onclick="goHome()" aria-current="page">

<span class="nav-icon">🏠</span>Home

</button>

<button class="nav-button" id="navWorkout" onclick="bottomWorkout()">

<span class="nav-icon">🏋️</span>Workout

</button>

<button class="nav-button" id="navProgress" onclick="showOverallProgress()">

<span class="nav-icon">📈</span>Progress

</button>

<button class="nav-button" id="navHistory" onclick="showGlobalHistory()">

<span class="nav-icon">🕘</span>History

</button>

<button class="nav-button" id="navTimer" onclick="showGlobalTimer()">

<span class="nav-icon">⏱️</span>Timer

</button>

</nav>

<div id="pickerOverlay" class="picker-overlay hidden" onclick="closePicker()"></div>

<div id="pickerSheet" class="picker-sheet hidden">

<div class="picker-toolbar">

<strong id="pickerTitle">Select</strong>

<button class="picker-done" onclick="confirmPicker()">Done</button>

</div>

<div class="wheel-wrap">

<div id="wheel" class="wheel"></div>

<div class="wheel-highlight"></div>

</div>

</div>

<script>

/* =========================

   EXERCISE LIBRARY

========================= */

const exerciseLibrary=[

{id:"machine-chest-press",name:"Machine Chest Press",muscle:"Chest",

image:"images/machine-chest-press.png",

how:"Adjust the seat so the handles are around mid-chest height. Keep your back against the pad. Press the handles forward until your arms are almost straight, then slowly return.",

tips:["Keep your chest up and back against the pad.","Keep your wrists straight.","Control the weight through the entire repetition."],

mistakes:["Using momentum.","Letting the shoulders roll forward.","Locking the elbows aggressively."]},

{id:"pec-deck",name:"Pec Deck",muscle:"Chest",

image:"images/pec-deck.png",

how:"Sit with your back against the pad. Position your arms on the pads or handles and bring them together in front of your chest. Squeeze your chest, then slowly return.",

tips:["Keep your chest lifted.","Maintain a slight bend in your elbows.","Control the return."],

mistakes:["Swinging the weight.","Going excessively heavy.","Letting the shoulders roll forward."]},

{id:"triceps-pushdown",name:"Triceps Pushdown",muscle:"Triceps",

image:"images/triceps-pushdown.png",

how:"Stand facing the cable. Keep your elbows close to your sides and push the attachment downward until your arms are nearly straight. Slowly return.",

tips:["Keep your elbows tucked.","Keep your upper arms still.","Squeeze the triceps at the bottom."],

mistakes:["Swinging your torso.","Moving your elbows forward.","Using momentum."]},

{id:"lat-pulldown",name:"Lat Pulldown",muscle:"Back",

image:"images/lat-pulldown.png",

how:"Secure your legs under the pads and grip the bar slightly wider than shoulder width. Pull the bar toward your upper chest while driving your elbows downward. Slowly return.",

tips:["Keep your chest up.","Think about pulling with your elbows.","Control the upward portion."],

mistakes:["Pulling behind the neck.","Swinging backward excessively.","Jerking the weight."]},

{id:"seated-row",name:"Seated Row Machine",muscle:"Back",

image:"images/seated-row.png",

how:"Sit upright and grip the handles. Pull them toward your torso while squeezing your shoulder blades together. Slowly extend your arms.",

tips:["Keep your chest tall.","Drive your elbows backward.","Control each repetition."],

mistakes:["Rounding your back.","Shrugging your shoulders.","Jerking the weight."]},

{id:"preacher-curl",name:"Preacher Curl Machine",muscle:"Biceps",

image:"images/preacher-curl.png",

how:"Place your upper arms firmly against the pad. Curl the handles upward while keeping your upper arms planted. Slowly lower until your arms are nearly straight.",

tips:["Keep your upper arms on the pad.","Lower the weight slowly.","Squeeze your biceps at the top."],

mistakes:["Lifting your elbows.","Dropping the weight.","Using excessive weight."]},

{id:"leg-press",name:"Leg Press",muscle:"Quads",

image:"images/leg-press.png",

how:"Place your feet about shoulder width apart. Lower the platform under control while keeping your back against the pad. Press through your feet to return.",

tips:["Keep your feet planted.","Keep your knees aligned with your toes.","Control the descent."],

mistakes:["Letting the knees collapse inward.","Allowing the lower back to round.","Aggressively locking the knees."]},

{id:"leg-extension",name:"Leg Extension",muscle:"Quads",

image:"images/leg-extension.png",

how:"Position your ankles behind the roller. Extend your knees until your legs are nearly straight. Squeeze your quads briefly and lower under control.",

tips:["Keep your hips against the seat.","Use controlled repetitions.","Squeeze the quads at the top."],

mistakes:["Kicking the weight.","Using momentum.","Dropping the weight quickly."]},

{id:"seated-leg-curl",name:"Seated Leg Curl",muscle:"Hamstrings",

image:"images/seated-leg-curl.png",

how:"Position your legs against the machine rollers. Curl your heels downward and back as far as comfortably possible. Slowly return.",

tips:["Keep your hips against the seat.","Squeeze your hamstrings.","Control the return."],

mistakes:["Lifting your hips.","Using momentum.","Moving too quickly."]},

{id:"calf-raise",name:"Calf Raise Machine",muscle:"Calves",

image:"images/calf-raise.png",

how:"Position the balls of your feet on the platform. Lower your heels for a controlled stretch, then raise your heels as high as comfortably possible.",

tips:["Use a full comfortable range of motion.","Pause briefly at the top.","Control the bottom stretch."],

mistakes:["Bouncing.","Using short repetitions.","Moving too quickly."]},

{id:"shoulder-press",name:"Shoulder Press Machine",muscle:"Shoulders",

image:"images/shoulder-press.png",

how:"Adjust the seat so the handles begin around shoulder height. Press upward until your arms are nearly straight and slowly lower.",

tips:["Keep your back against the pad.","Keep your wrists straight.","Control the lowering phase."],

mistakes:["Excessively arching the lower back.","Using momentum.","Dropping the weight."]},

{id:"lateral-raise",name:"Lateral Raise Machine",muscle:"Shoulders",

image:"images/lateral-raise.png",

how:"Position your arms against the pads and raise them outward until approximately shoulder height. Slowly lower.",

tips:["Keep the movement controlled.","Focus on the side delts.","Keep your shoulders down."],

mistakes:["Shrugging.","Swinging the weight.","Going excessively heavy."]},

{id:"biceps-curl",name:"Biceps Curl Machine",muscle:"Biceps",

image:"images/biceps-curl.png",

mistakes:["Lifting the elbows.","Swinging.","Using momentum."]},

{id:"triceps-extension",name:"Triceps Extension Machine",muscle:"Triceps",

image:"images/triceps-extension.png",

how:"Position yourself securely in the machine. Extend your arms against the resistance until nearly straight and slowly return.",

tips:["Keep your shoulders stable.","Move through the elbows.","Use controlled repetitions."],

mistakes:["Moving the shoulders excessively.","Using momentum.","Going too heavy."]},

{id:"incline-chest-press",name:"Incline Chest Press Machine",muscle:"Chest",

how:"Press the handles upward and forward while keeping your back against the pad.",

tips:["Control the weight.","Keep your shoulders down."],

mistakes:["Using momentum.","Overarching your back."]},

{id:"cable-fly",name:"Cable Fly",muscle:"Chest",

how:"Bring the cable handles together in front of your chest while maintaining a slight elbow bend.",

tips:["Keep tension on the chest.","Move smoothly."],

mistakes:["Turning it into a press.","Using too much weight."]},

{id:"assisted-pullup",name:"Assisted Pull-Up",muscle:"Back",

how:"Use the assistance platform and pull your chest upward while driving your elbows down.",

tips:["Keep your chest tall.","Control the descent."],mistakes:["Swinging.","Shrugging."]},

{id:"straight-arm-pulldown",name:"Straight-Arm Pulldown",muscle:"Back",

how:"Keep your arms mostly straight and pull the cable attachment toward your thighs.",

tips:["Focus on your lats.","Keep your torso stable."],

mistakes:["Bending the elbows excessively.","Swinging."]},

{id:"reverse-pec-deck",name:"Reverse Pec Deck",muscle:"Shoulders",

how:"Face the machine and move your arms outward and backward under control.",

tips:["Keep your chest supported.","Control the return."],mistakes:["Shrugging.","Using momentum."]},

{id:"cable-lateral-raise",name:"Cable Lateral Raise",muscle:"Shoulders",

how:"Raise the cable outward until your arm reaches approximately shoulder height.",

tips:["Keep tension on the delt.","Move slowly."],mistakes:["Shrugging.","Swinging."]},

{id:"cable-curl",name:"Cable Curl",muscle:"Biceps",

how:"Keep your elbows close to your sides and curl the attachment toward your shoulders.",

tips:["Keep elbows stationary.","Squeeze at the top."],

mistakes:["Swinging.","Moving the elbows forward."]},

{id:"hammer-curl",name:"Hammer Curl",muscle:"Biceps",

how:"Hold the weights with palms facing inward and curl them toward your shoulders.",

tips:["Keep elbows tucked.","Control the lowering phase."],mistakes:["Swinging.","Using momentum."]},

{id:"overhead-triceps",name:"Overhead Cable Triceps Extension",muscle:"Triceps",

how:"With the cable behind you, extend your elbows until your arms are nearly straight.",

tips:["Keep elbows stable.","Control the stretch."],

/* SETS + COMPARISON */

function createSetRows(unique){

let html="";

for(let set=1;set<=4;set++){

const key=unique+"-set"+set;

const current=setHistory[key]||{weight:"",reps:""};

const previous=previousHistory[key]||{weight:"",reps:""};

const cw=current.weight!==""&&current.weight!==undefined?`${current.weight} lb`:"Weight";

const cr=current.reps!==""&&current.reps!==undefined?`${current.reps} reps`:"Reps";

let prev="No previous workout";

if(previous.weight!==""&&previous.weight!==undefined&&previous.reps!==""&&previous.reps!==undefined)

prev=`Previous: ${previous.weight} lb × ${previous.reps}`;

else if(previous.weight!==""&&previous.weight!==undefined) prev=`Previous: ${previous.weight} lb`;

else if(previous.reps!==""&&previous.reps!==undefined) prev=`Previous: ${previous.reps} reps`;

const comparison=compareSet(current,previous);

html+=`

<div class="set-block">

<div class="set-row">

<span class="set-label">Set ${set}</span>

<button class="picker-button" id="${safeId(key+"-weight-button")}"

onclick="openPicker('${escapeAttribute(key)}','weight')">${cw}</button>

<button class="picker-button" id="${safeId(key+"-reps-button")}"

onclick="openPicker('${escapeAttribute(key)}','reps')">${cr}</button>

</div>

<div class="previous">${prev}</div>

${comparison?`<div class="compare ${comparison.cls}" id="${safeId(key+"-compare")}">${comparison.text}</div>`:""}

</div>`;

}

return html;

}

function compareSet(current,previous){

const cw=Number(current.weight),cr=Number(current.reps);

const pw=Number(previous.weight),pr=Number(previous.reps);

if(current.weight===""||current.reps==="") return null;

if(previous.weight===""||previous.reps===""||

previous.weight===undefined||previous.reps===undefined)

return {text:"NEW",cls:"new"};

if(cw===pw&&cr===pr) return {text:"= Matched Previous",cls:"match"};

/* Improvement:

   heavier with same/more reps OR same weight with more reps.

   If one rises while the other falls, estimated volume decides. */

if((cw>pw&&cr>=pr)||(cw===pw&&cr>pr))

return {text:"↑ Beat Previous",cls:"beat"};

if((cw<pw&&cr<=pr)||(cw===pw&&cr<pr))

return {text:"↓ Below Previous",cls:"below"};

const currentVolume=cw*cr;

const previousVolume=pw*pr;

if(currentVolume>previousVolume)

return {text:"↑ Beat Previous",cls:"beat"};

if(currentVolume===previousVolume)

return {text:"= Matched Previous",cls:"match"};

return {text:"↓ Below Previous",cls:"below"};

}

function saveSet(key,type,value){

if(!setHistory[key])setHistory[key]={weight:"",reps:""};

setHistory[key][type]=value;

localStorage.setItem("setHistoryV5",JSON.stringify(setHistory));

}

/* PICKER */

let pickerKey=null,pickerType=null,pickerValues=[],pickerSelectedIndex=0;

function openPicker(key,type){

pickerKey=key;pickerType=type;

const wheel=document.getElementById("wheel");wheel.innerHTML="";

pickerValues=[];

if(type==="weight"){

document.getElementById("pickerTitle").textContent="Select Weight";

for(let i=0;i<=500;i+=5)pickerValues.push(i);

}else{

document.getElementById("pickerTitle").textContent="Select Reps";

for(let i=1;i<=50;i++)pickerValues.push(i);

}

pickerValues.forEach(v=>{

const o=document.createElement("div");o.className="wheel-option";

o.textContent=type==="weight"?`${v} lb`:`${v} reps`;wheel.appendChild(o);

});

const existing=setHistory[key]&&setHistory[key][type]!==""?

Number(setHistory[key][type]):null;

let index=0;

if(existing!==null&&pickerValues.indexOf(existing)>=0)

index=pickerValues.indexOf(existing);

pickerSelectedIndex=index;

document.getElementById("pickerOverlay").classList.remove("hidden");

document.getElementById("pickerSheet").classList.remove("hidden");

requestAnimationFrame(()=>wheel.scrollTop=index*52);

}

function closePicker(){

document.getElementById("pickerOverlay").classList.add("hidden");

document.getElementById("pickerSheet").classList.add("hidden");

}

document.getElementById("wheel").addEventListener("scroll",()=>{

const index=Math.round(document.getElementById("wheel").scrollTop/52);

pickerSelectedIndex=Math.max(0,Math.min(index,pickerValues.length-1));

});

function confirmPicker(){

if(pickerKey===null||pickerType===null||!pickerValues.length){closePicker();return}

const value=pickerValues[pickerSelectedIndex];

saveSet(pickerKey,pickerType,value);

const b=document.getElementById(safeId(pickerKey+"-"+pickerType+"-button"));

if(b)b.textContent=pickerType==="weight"?`${value} lb`:`${value} reps`;

refreshComparison(pickerKey);

closePicker();

}

function refreshComparison(key){

const old=document.getElementById(safeId(key+"-compare"));

const c=compareSet(setHistory[key]||{},previousHistory[key]||{});

if(old){

if(c){old.className="compare "+c.cls;old.textContent=c.text}

else old.remove();

}

}

/* FINISH WORKOUT + HISTORY */

function finishWorkout(){

if(!activeWorkoutKey)return;

const session={

id:Date.now(),

date:new Date().toISOString(),

workoutKey:activeWorkoutKey,

workoutTitle:activeWorkoutTitle,

exercises:[]

};

activeWorkoutExerciseIds.forEach(exerciseId=>{

const ex=getExercise(exerciseId);

const exerciseSession={id:exerciseId,name:ex?ex.name:exerciseId,sets:[]};

for(let set=1;set<=4;set++){

const key=`${activeWorkoutKey}-${exerciseId}-set${set}`;

const current=setHistory[key]||{weight:"",reps:""};

if(current.weight!==""||current.reps!==""){

exerciseSession.sets.push({

set,

weight:current.weight??"",

reps:current.reps??""

});

}

if(setHistory[key]){

previousHistory[key]={

weight:setHistory[key].weight??"",

reps:setHistory[key].reps??""

};

}

}

if(exerciseSession.sets.length)session.exercises.push(exerciseSession);

});

if(!session.exercises.length){

alert("Enter at least one set before finishing your workout.");

return;

}

workoutHistory.unshift(session);

localStorage.setItem("workoutHistoryV52",JSON.stringify(workoutHistory));

localStorage.setItem("previousHistoryV51",JSON.stringify(previousHistory));

alert("Workout saved! It is now in your History and Progress.");

goHome();

}

const total=Object.values(presetWorkouts).reduce((s,w)=>s+w.exercises.length,0);

const done=completedExercises.filter(id=>id.startsWith("preset-")).length;

const percent=total?Math.min(done/total*100,100):0;

function historyCard(session){

ex.sets.forEach(s=>{

html+=`<div class="history-set">Set ${s.set}: ${s.weight!==""?s.weight+" lb":"—"} × ${s.reps!==""?s.reps+" reps":"—"}</div>`;

});

html+="</div>";

});

card.innerHTML=html;return card;

function formatDate(date){

return new Date(date).toLocaleString([],{

month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"

});

}

function getExerciseStats(id,sessions){

const records=[];

sessions.forEach(session=>{

const ex=session.exercises.find(x=>x.id===id);

if(ex)ex.sets.forEach(s=>{

if(s.weight!==""&&s.reps!=="")records.push({weight:Number(s.weight),reps:Number(s.reps)});

});

});

if(!records.length)return "No completed sets recorded yet.";

const maxWeight=Math.max(...records.map(x=>x.weight));

const maxReps=Math.max(...records.map(x=>x.reps));

const maxVolume=Math.max(...records.map(x=>x.weight*x.reps));

return `Best weight: ${maxWeight} lb · Best reps: ${maxReps} · Best set volume: ${maxVolume.toLocaleString()} lb`;

}

let timerSeconds=90;

let timerRemaining=90;

let timerInterval=null;

function renderTimer(target){

const area=document.getElementById(target);

area.innerHTML=`

<div class="timer-display" data-timer-display>${formatTimer(timerRemaining)}</div>

<button class="timer-button" onclick="setTimer(60)">1:00</button>

<button class="timer-button" onclick="setTimer(90)">1:30</button>

<button class="timer-button" onclick="setTimer(120)">2:00</button>

</div>

<button class="timer-start" onclick="toggleTimer()" data-timer-start>${timerInterval?"Pause":"Start Timer"}</button>

<button class="timer-reset" onclick="resetTimer()">Reset</button>

</div>`;

}

function showGlobalTimer(){

showScreen("globalTimerScreen");setBottomNav("Timer");

renderTimer("globalTimerContent");

}

function setTimer(seconds){

clearInterval(timerInterval);timerInterval=null;

timerSeconds=seconds;timerRemaining=seconds;updateTimerDisplays();

}

function toggleTimer(){

if(timerInterval){

clearInterval(timerInterval);timerInterval=null;updateTimerDisplays();return;

}

if(timerRemaining<=0)timerRemaining=timerSeconds;

timerInterval=setInterval(()=>{

timerRemaining--;

updateTimerDisplays();

if(timerRemaining<=0){

clearInterval(timerInterval);timerInterval=null;

if(navigator.vibrate)navigator.vibrate([200,100,200]);

updateTimerDisplays();

}

},1000);

updateTimerDisplays();

}

function resetTimer(){

clearInterval(timerInterval);timerInterval=null;

timerRemaining=timerSeconds;updateTimerDisplays();

}

function formatTimer(sec){

const m=Math.floor(sec/60),s=sec%60;

return `${m}:${String(s).padStart(2,"0")}`;

}

function updateTimerDisplays(){

document.querySelectorAll("[data-timer-display]").forEach(x=>x.textContent=formatTimer(timerRemaining));

document.querySelectorAll("[data-timer-start]").forEach(x=>x.textContent=timerInterval?"Pause":"Start Timer");

}

});

}

function addBuilderExercise(id){

if(!builderSelected.includes(id))builderSelected.push(id);

renderBuilderSelected();renderBuilderLibrary();

}

function removeBuilderExercise(id){

builderSelected=builderSelected.filter(x=>x!==id);

renderBuilderSelected();renderBuilderLibrary();

}

function renderBuilderSelected(){

const area=document.getElementById("builderExercises");area.innerHTML="";

if(!builderSelected.length){

area.innerHTML='<div class="small">No exercises added yet.</div>';return;

}

builderSelected.forEach((id,index)=>{

const ex=getExercise(id);if(!ex)return;

const item=document.createElement("div");item.className="builder-exercise";

item.innerHTML=`<strong>${index+1}. ${escapeHTML(ex.name)}</strong>

<span class="badge">${escapeHTML(ex.muscle)}</span>

<button class="remove-small" style="float:right">Remove</button>`;

item.querySelector("button").onclick=()=>removeBuilderExercise(id);

area.appendChild(item);

});

}

function saveCustomWorkout(){

const name=document.getElementById("customWorkoutName").value.trim();

if(!name){alert("Give your workout a name first.");return}

if(!builderSelected.length){alert("Add at least one exercise.");return}

customWorkouts.push({id:Date.now(),name,exercises:[...builderSelected]});

localStorage.setItem("customWorkoutsV5",JSON.stringify(customWorkouts));

goHome();

}

function deleteCustomWorkout(index){

const workout=customWorkouts[index];if(!workout)return;

if(!confirm(`Delete "${workout.name}"?`))return;

customWorkouts.splice(index,1);

localStorage.setItem("customWorkoutsV5",JSON.stringify(customWorkouts));

goHome();

}

/* START */

renderHome();

updateProgress();

if("serviceWorker" in navigator){

window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));

}

</script>

</body>

</html>
