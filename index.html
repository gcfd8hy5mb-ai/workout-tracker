<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#003b49"><meta name="apple-mobile-web-app-capable" content="yes"><title>MYLIFTCOACH · Sign In</title><link rel="icon" href="images/myliftcoach-icon.svg" type="image/svg+xml">
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#003b49;color:#ffeed7}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:linear-gradient(#002a38b8,#002a38cb),url("images/luxury-login-stone.webp") center/cover}.shell{width:min(100%,430px);text-align:center}.brand{width:min(90%,310px);max-height:165px;object-fit:contain}.tagline{font:12px Georgia,serif;letter-spacing:.27em;margin:12px 0 22px}.card{background:linear-gradient(145deg,#002c39f7,#001b27fc);border:2px solid #bc9b69;border-radius:26px;padding:30px 24px 23px;box-shadow:0 20px 70px #00151b9c}h1{font:400 40px Georgia,serif;margin:0 0 8px}p.sub{font:17px Georgia,serif;color:#e5dfd1;margin:0 0 24px}.tabs{display:flex;gap:6px;border:1px solid #547c84;padding:5px;border-radius:13px;margin-bottom:22px}.tabs button{flex:1;border:0;border-radius:9px;background:transparent;color:#aebfc0;font:17px Georgia,serif;min-height:44px}.tabs button.active{background:linear-gradient(120deg,#004451,#086c78);color:#fff;border:1px solid #bca476}label{display:block;text-align:left;font:600 12px Georgia,serif;letter-spacing:.18em;margin:15px 0 8px}input{width:100%;min-height:56px;border:2px solid #c9ae7c;border-radius:14px;padding:13px 14px;font:18px Georgia,serif;background:#fffbea;color:#082c35}input:focus{outline:3px solid #33c1c8}.pw{position:relative}.pw input{padding-right:85px}.show{position:absolute;right:8px;top:8px;height:40px;border:0;border-radius:10px;background:#006070;color:white;padding:0 15px}.submit{width:100%;min-height:58px;background:linear-gradient(100deg,#00404c,#087280);color:#fff;border:1px solid #bd9d70;border-radius:13px;margin-top:25px;font:600 17px Georgia,serif;letter-spacing:.12em}.submit:disabled{opacity:.6}.link{background:none;border:0;color:#ead5b3;text-decoration:underline;font:16px Georgia,serif;margin-top:20px}.status{color:#ffd9a4;min-height:27px;line-height:1.5;font-size:14px;margin:18px 0 6px}.note{font-size:12px;color:#b5c7c7;line-height:1.5}[hidden]{display:none!important}</style></head>
<body><main><div class="shell"><img class="brand" src="images/myliftcoach-luxury-brand.webp" alt="MYLIFTCOACH"><div class="tagline">TRAIN · TRACK · PROGRESS</div><section class="card"><h1 id="heading">Welcome back</h1><p class="sub" id="sub">Sign in to continue your training.</p><div class="tabs"><button type="button" id="tabIn" class="active">Sign In</button><button type="button" id="tabUp">Sign Up</button></div><form id="form"><label for="email">EMAIL</label><input type="email" id="email" autocomplete="email" autocapitalize="none" required placeholder="you@example.com"><label for="password">PASSWORD</label><div class="pw"><input type="password" id="password" autocomplete="current-password" minlength="6" required><button type="button" class="show" id="show">Show</button></div><div id="confirmBox" hidden><label for="confirm">CONFIRM PASSWORD</label><input type="password" id="confirm" minlength="6"></div><button type="submit" class="submit" id="submit">SIGN IN</button></form><button type="button" class="link" id="forgot">Forgot password?</button><p class="status" role="status" id="status"></p><p class="note">Your training data stays tied to your MYLIFTCOACH account.</p></section></div></main>
<script src="supabase-config.js"></script>
<script>
(function(){
'use strict';
var get=function(id){return document.getElementById(id)},form=get('form'),status=get('status'),button=get('submit'),cfg=window.PRISM_SUPABASE_CONFIG,mode='signin',busy=false;
function note(x){status.textContent=x}
function loading(on){busy=on;button.disabled=on;button.textContent=on?'PLEASE WAIT…':mode==='signin'?'SIGN IN':'CREATE ACCOUNT'}
function destination(){var u=new URL('app.html',location.href);u.search=location.search;return u.href}
try{var old=JSON.parse(window.localStorage.getItem('prismSupabaseSessionV1')||'null');var valid=old&&old.access_token&&old.user&&old.user.id&&Number(old.expires_at)>Math.floor(Date.now()/1000)+60;if(valid)location.replace(destination())}catch(e){}
function tab(which){if(busy)return;mode=which;get('tabIn').classList.toggle('active',which==='signin');get('tabUp').classList.toggle('active',which!=='signin');get('confirmBox').hidden=which==='signin';get('confirm').required=which!=='signin';get('heading').textContent=which==='signin'?'Welcome back':'Create your account';get('sub').textContent=which==='signin'?'Sign in to continue your training.':'Start your training journey.';get('forgot').hidden=which!=='signin';note('');loading(false)}
get('tabIn').onclick=function(){tab('signin')};get('tabUp').onclick=function(){tab('signup')};
get('show').onclick=function(){var input=get('password'),visible=input.type==='password';input.type=visible?'text':'password';get('show').textContent=visible?'Hide':'Show'};
async function request(path,data){if(!cfg||!cfg.url||!cfg.publishableKey)throw Error('Account service is not configured');var ctrl=new AbortController(),timer=setTimeout(function(){ctrl.abort()},15000);try{var response=await fetch(cfg.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},body:JSON.stringify(data),signal:ctrl.signal});var result=await response.json().catch(function(){return {}});if(!response.ok){var e=new Error(result.msg||result.message||result.error_description||'Authentication failed');e.status=response.status;throw e}return result}catch(e){if(e.name==='AbortError')throw Error('The account service did not respond within 15 seconds');throw e}finally{clearTimeout(timer)}}
async function verifyAccount(data){if(!data||!data.access_token||!data.user||!data.user.id)throw Error('The account service did not return a valid session');var controller=new AbortController(),timeout=setTimeout(function(){controller.abort()},12000);try{var response=await fetch(cfg.url+'/auth/v1/user',{method:'GET',headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+data.access_token},cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('Your login was accepted, but the account verification was rejected (HTTP '+response.status+'). Please retry.');var user=await response.json();if(!user||user.id!==data.user.id)throw Error('Your account identity could not be verified. No data was opened.');return data}catch(error){if(error.name==='AbortError')throw Error('Login succeeded, but account verification timed out. Please retry.');throw error}finally{clearTimeout(timeout)}}
async function enter(data){
 if(!data||!data.access_token||!data.user||!data.user.id)throw Error('No verified account session was returned');
 var saved=Object.assign({},data,{expires_at:data.expires_at||Math.floor(Date.now()/1000)+(data.expires_in||3600)});
 window.localStorage.setItem('prismSupabaseSessionV1',JSON.stringify(saved));
 var target=destination(),link=document.createElement('a');
 link.href=target;link.textContent='Continue to MYLIFTCOACH →';
 link.style.cssText='display:block;color:#ffdfb5;margin:12px 0';
 status.after(link);
 note('Login verified. Checking workout page…');
 var controller=new AbortController(),timer=setTimeout(function(){controller.abort()},12000);
 try{
  var response=await fetch(target,{method:'GET',cache:'no-store',credentials:'same-origin',signal:controller.signal});
  var contentType=response.headers.get('content-type')||'';
  if(!response.ok)throw Error('Workout page unavailable (HTTP '+response.status+'). The Vercel preview may require access for app.html.');
  if(!contentType.includes('text/html'))throw Error('Workout page returned an unexpected file type: '+contentType);
  if(response.body&&response.body.cancel)response.body.cancel().catch(function(){});
  note('Workout page reachable. Opening MYLIFTCOACH…');
  try{window.sessionStorage.setItem('mlc-navigation-stage','workout-page-ok')}catch(_){}
  window.location.assign(target);
  setTimeout(function(){if(document.visibilityState==='visible')note('Workout page responded, but Safari has not completed navigation. Try Continue above.');},8500);
 }catch(error){
  note(error.name==='AbortError'?'Workout page did not respond within 12 seconds. The issue is loading app.html, not your password.':error.message);
 }finally{clearTimeout(timer)}
}

form.onsubmit=async function(ev){ev.preventDefault();if(busy)return;var email=get('email').value.trim(),password=get('password').value;if(!email||password.length<6){note('Enter a valid email and password');return}if(mode==='signup'&&password!==get('confirm').value){note('Passwords do not match');return}loading(true);note('Connecting to the account service…');try{if(mode==='signin'){await enter(await verifyAccount(await request('token?grant_type=password',{email:email,password:password})))}else{var url=encodeURIComponent(new URL('index.html',location.href).href),r=await request('signup?redirect_to='+url,{email:email,password:password});if(r.access_token)await enter(await verifyAccount(r));else note('Please confirm your email, then sign in')}}catch(e){note(e.status===400?'Invalid email or password':e.message||'Sign-in failed')}finally{loading(false)}};
try{var report=window.sessionStorage.getItem('mlc-auth-handoff-error');if(report){window.sessionStorage.removeItem('mlc-auth-handoff-error');note('Login did not finish: '+report)}}catch(e){}
get('forgot').onclick=async function(){if(busy)return;var email=get('email').value.trim();if(!email){note('Enter your email first');return}loading(true);try{await request('recover?redirect_to='+encodeURIComponent(new URL('index.html',location.href).href),{email:email});note('Check your email for a password reset link')}catch(e){note(e.message||'Password reset failed')}finally{loading(false)}};
})();
</script></body></html>
