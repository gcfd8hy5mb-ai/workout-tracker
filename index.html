<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Workout">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="images/app-icon.png">

<title>Workout Tracker</title>

<style>

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}

:root{

  --bg:#f2f2f7;

  --card:#fff;

  --text:#111;

  --sub:#6e6e73;

  --line:#e5e5ea;

  --green:#28a745;

  --red:#dc3545;

  --blue:#007aff;

}

body{

  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;

  background:var(--bg);

  color:var(--text);

  padding-bottom:40px;

}

header{

  background:#111;

  color:#fff;

  padding:calc(18px + env(safe-area-inset-top)) 18px 18px;

  text-align:center;

}

header h1{

  margin:0;

  font-size:28px;

}

header p{

  margin:5px 0 0;

  color:#aaa;

  font-size:14px;

}

.container{

  max-width:750px;

  margin:auto;

  padding:16px;

}

.hidden{

  display:none !important;

}

.card{

  background:white;

  border-radius:18px;

  padding:16px;

  margin-bottom:14px;

  box-shadow:0 2px 8px rgba(0,0,0,.07);

}

.progress-bar{

  height:10px;

  background:#ddd;

  border-radius:10px;

  overflow:hidden;

  margin-top:10px;

}

.progress-fill{

  height:100%;

  width:0%;

  background:#111;

  transition:.3s;

}

.small{

  color:var(--sub);

  font-size:13px;

}

.day-button,

.action-button{

  width:100%;

  border:0;

  background:white;

  border-radius:17px;

  padding:18px;

  margin-bottom:12px;

  text-align:left;

  font-size:18px;

  font-weight:750;

  box-shadow:0 2px 8px rgba(0,0,0,.07);

}

.day-button span,

.action-button span{

  display:block;

  color:var(--sub);

  font-size:14px;

  font-weight:400;

  margin-top:5px;

}

.primary{

  background:#111;

  color:white;

}

.primary span{

  color:#ccc;

}

.section-heading{

  margin:24px 2px 12px;

  font-size:20px;

}

.back{

  border:0;

  background:transparent;

  color:var(--blue);

  font-size:17px;

  font-weight:650;

  padding:5px 0 14px;

}

.exercise{

  background:white;

  border-radius:18px;

  overflow:hidden;

  margin-bottom:14px;

  box-shadow:0 2px 8px rgba(0,0,0,.07);

}

.exercise-header{

  padding:16px;

}

.exercise-title{

  font-size:19px;

  font-weight:750;

}

.muscle{

  display:inline-block;

  background:#eee;

  color:#555;

  padding:5px 9px;

  border-radius:8px;

  font-size:13px;

  margin-top:7px;

}

.details{

  display:none;

  border-top:1px solid var(--line);

  padding:0 16px 18px;

}

.details.open{

  display:block;

}

.exercise-image{

  width:100%;

  max-height:350px;

  object-fit:contain;

  background:#eee;

  border-radius:14px;

  margin-top:16px;

}

.image-placeholder{

  width:100%;

  min-height:190px;

  background:#eee;

  border-radius:14px;

  margin-top:16px;

  display:flex;

  justify-content:center;

  align-items:center;

  text-align:center;

  color:#777;

  padding:20px;

}

.detail-title{

  font-weight:750;

  margin:18px 0 7px;

}

.details p,

.details li{

  color:#444;

  line-height:1.5;

  font-size:15px;

}

.details ul{

  padding-left:20px;

}

.tracking{

  background:#f7f7f9;

  padding:13px;

  border-radius:14px;

  margin-top:17px;

}

.set-block{

  padding:12px 0;

  border-bottom:1px solid #ddd;

}

.set-block:last-of-type{

  border-bottom:0;

}

.set-row{

  display:grid;

  grid-template-columns:48px 1fr 1fr;

  gap:8px;

  align-items:center;

}

.set-label{

  font-weight:700;

  font-size:14px;

}

.picker-button{

  border:1px solid #ccc;

  background:#fff;

  border-radius:11px;

  padding:12px 6px;

  font-size:15px;

  font-weight:650;

  min-height:46px;

}

.previous{

  margin:7px 0 0 56px;

  font-size:12px;

  color:#777;

}

.complete{

  width:100%;

  border:0;

  background:#111;

  color:#fff;

  border-radius:11px;

  padding:13px;

  font-weight:700;

  font-size:15px;

  margin-top:12px;

}

.complete.done{

  background:var(--green);

}

.finish-workout{

  width:100%;

  border:0;

  border-radius:15px;

  padding:17px;

  background:var(--green);

  color:#fff;

  font-size:17px;

  font-weight:800;

  margin:5px 0 20px;

}

input,

select{

  width:100%;

  padding:13px;

  border:1px solid #ccc;

  border-radius:11px;

  background:#fff;

  font-size:16px;

}

label{

  display:block;

  font-weight:650;

  margin:14px 0 6px;

}

.library-item{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  border-bottom:1px solid var(--line);

  padding:13px 0;

}

.library-item:last-child{

  border-bottom:0;

}

.library-name{

  font-weight:700;

}

.add-small{

  border:0;

  background:#111;

  color:#fff;

  padding:9px 13px;

  border-radius:9px;

  font-weight:700;

  white-space:nowrap;

}

.remove-small{

  border:0;

  background:#eee;

  padding:8px 11px;

  border-radius:9px;

  font-weight:650;

}

.save-button{

  width:100%;

  border:0;

  background:#111;

  color:#fff;

  padding:15px;

  border-radius:12px;

  font-size:16px;

  font-weight:750;

  margin-top:15px;

}

.delete-button{

  width:100%;

  border:0;

  background:#fff;

  color:var(--red);

  padding:13px;

  border-radius:12px;

  font-weight:700;

  margin-top:8px;

}

.search{

  margin-bottom:10px;

}

.builder-list{

  margin-top:10px;

}

.builder-exercise{

  background:#f4f4f6;

  border-radius:12px;

  padding:12px;

  margin-bottom:8px;

}

.builder-exercise strong{

  display:block;

  margin-bottom:3px;

}

.badge{

  display:inline-block;

  font-size:12px;

  color:#666;

}

.empty{

  color:#777;

  text-align:center;

  padding:20px;

}

/* =========================

   WHEEL PICKER

========================= */

.picker-overlay{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.35);

  z-index:9998;

}

.picker-sheet{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  background:#f8f8f8;

  border-radius:22px 22px 0 0;

  z-index:9999;

  padding-bottom:calc(12px + env(safe-area-inset-bottom));

  box-shadow:0 -8px 30px rgba(0,0,0,.18);

}

.picker-toolbar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:14px 18px;

  background:white;

  border-radius:22px 22px 0 0;

  border-bottom:1px solid #ddd;

}

.picker-toolbar strong{

  font-size:17px;

}

.picker-done{

  border:0;

  background:transparent;

  color:var(--blue);

  font-size:17px;

  font-weight:700;

}

.wheel-wrap{

  position:relative;

  height:260px;

  overflow:hidden;

  background:#f8f8f8;

}

.wheel{

  height:260px;

  overflow-y:scroll;

  scroll-snap-type:y mandatory;

  -webkit-overflow-scrolling:touch;

  padding:104px 0;

}

.wheel::-webkit-scrollbar{

  display:none;

}

.wheel-option{

  height:52px;

  display:flex;

  align-items:center;

  justify-content:center;

  scroll-snap-align:center;

  font-size:24px;

  font-weight:600;

}

.wheel-highlight{

  pointer-events:none;

  position:absolute;

  top:104px;

  left:18px;

  right:18px;

  height:52px;

  border-top:1px solid #bbb;

  border-bottom:1px solid #bbb;

}

@media(max-width:390px){

  .set-row{

    grid-template-columns:42px 1fr 1fr;

  }

  .previous{

    margin-left:50px;

  }

}

</style>

</head>

<body>

<header>

<h1>Workout Tracker</h1>

<p>Version 5.1</p>

</header>

<div class="container">

<section id="home">

<div class="card">

<strong>Workout Progress</strong>

<div class="small" id="progressText"></div>

<div class="progress-bar">

<div class="progress-fill" id="progressFill"></div>

</div>

</div>

<button class="action-button primary" onclick="showBuilder()">

＋ Create Your Own Workout

<span>Build a workout using the exercise library</span>

</button>

<button class="action-button" onclick="showLibrary()">

Exercise Library

<span>Browse exercises and instructions</span>

</button>

<h2 class="section-heading">Preset Workouts</h2>

<div id="presetButtons"></div>

<h2 class="section-heading">My Workouts</h2>

<div id="customButtons"></div>

</section>

<section id="workoutScreen" class="hidden">

<button class="back" onclick="goHome()">← Back</button>

<h2 id="workoutTitle"></h2>

<div id="exerciseList"></div>

<button

 id="finishWorkoutButton"

 class="finish-workout"

 onclick="finishWorkout()">

 Finish Workout

</button>

</section>

<section id="libraryScreen" class="hidden">

<button class="back" onclick="goHome()">← Back</button>

<h2>Exercise Library</h2>

<input

 id="librarySearch"

 class="search"

 type="search"

 placeholder="Search exercises..."

 oninput="renderLibrary()">

<select id="muscleFilter" onchange="renderLibrary()">

<option value="All">All Muscle Groups</option>

<option>Chest</option>

<option>Back</option>

<option>Shoulders</option>

<option>Biceps</option>

<option>Triceps</option>

<option>Quads</option>

<option>Hamstrings</option>

<option>Glutes</option>

<option>Calves</option>

<option>Core</option>

</select>

<div class="card" id="libraryList"></div>

</section>

<section id="builderScreen" class="hidden">

<button class="back" onclick="goHome()">← Cancel</button>

<h2>Create Workout</h2>

<div class="card">

<label>Workout Name</label>

<input

 id="customWorkoutName"

 placeholder="Example: Monday Push Day">

<div class="detail-title">

Exercises Added

</div>

<div id="builderExercises" class="builder-list"></div>

</div>

<h3>Choose Exercises</h3>

<input

 id="builderSearch"

 class="search"

 type="search"

 placeholder="Search exercise library..."

 oninput="renderBuilderLibrary()">

<div class="card" id="builderLibrary"></div>

<button class="save-button" onclick="saveCustomWorkout()">

Save Workout

</button>

</section>

</div>

<!-- Wheel picker -->

<div id="pickerOverlay"

     class="picker-overlay hidden"

     onclick="closePicker()"></div>

<div id="pickerSheet" class="picker-sheet hidden">

<div class="picker-toolbar">

<strong id="pickerTitle">

Select

</strong>

<button class="picker-done" onclick="confirmPicker()">

Done

</button>

</div>

<div class="wheel-wrap">

<div id="wheel" class="wheel"></div>

<div class="wheel-highlight"></div>

</div>

</div>

JSON.parse(localStorage.getItem("customWorkoutsV5")||"[]");

let setHistory=

JSON.parse(localStorage.getItem("setHistoryV5")||"{}");

let previousHistory=

JSON.parse(localStorage.getItem("previousHistoryV51")||"{}");

let builderSelected=[];

let activeWorkoutKey=null;

let activeWorkoutExerciseIds=[];

let activeCustomIndex=null;

/* =========================

   HELPERS

========================= */

function getExercise(id){

return exerciseLibrary.find(ex=>ex.id===id);

}

function showScreen(screen){

["home","workoutScreen","libraryScreen","builderScreen"]

.forEach(id=>{

document.getElementById(id).classList.add("hidden");

});

document.getElementById(screen).classList.remove("hidden");

window.scrollTo(0,0);

}

function goHome(){

closePicker();

showScreen("home");

renderHome();

updateProgress();

}

/* =========================

   HOME

========================= */

function renderHome(){

const preset=document.getElementById("presetButtons");

preset.innerHTML="";

Object.entries(presetWorkouts).forEach(([key,w])=>{

const button=document.createElement("button");

button.className="day-button";

button.innerHTML=

`${w.title}<span>${w.subtitle}</span>`;

button.onclick=()=>openPresetWorkout(key);

preset.appendChild(button);

});

renderCustomButtons();

}

function renderCustomButtons(){

const area=document.getElementById("customButtons");

area.innerHTML="";

if(!customWorkouts.length){

area.innerHTML=

`<div class="card empty">

You haven't created a custom workout yet.

</div>`;

return;

}

customWorkouts.forEach((w,index)=>{

const button=document.createElement("button");

button.className="day-button";

button.innerHTML=

`${escapeHTML(w.name)}

<span>${w.exercises.length} exercises</span>`;

button.onclick=()=>openCustomWorkout(index);

area.appendChild(button);

});

}

/* =========================

   OPEN WORKOUTS

========================= */

function openPresetWorkout(key){

activeWorkoutKey="preset-"+key;

activeWorkoutExerciseIds=[

...presetWorkouts[key].exercises

];

activeCustomIndex=null;

openWorkout(

presetWorkouts[key].title,

activeWorkoutExerciseIds,

false

);

}

function openCustomWorkout(index){

const workout=customWorkouts[index];

activeWorkoutKey="custom-"+workout.id;

activeWorkoutExerciseIds=[

...workout.exercises

];

activeCustomIndex=index;

openWorkout(

workout.name,

activeWorkoutExerciseIds,

true

);

}

function openWorkout(title,exerciseIds,isCustom){

showScreen("workoutScreen");

document.getElementById("workoutTitle").textContent=title;

const list=document.getElementById("exerciseList");

list.innerHTML="";

exerciseIds.forEach((id,i)=>{

const exercise=getExercise(id);

if(!exercise)return;

const unique=

activeWorkoutKey+"-"+exercise.id;

list.appendChild(

createExerciseCard(exercise,unique,i)

);

});

if(isCustom){

const deleteButton=document.createElement("button");

deleteButton.className="delete-button";

deleteButton.textContent="Delete This Workout";

deleteButton.onclick=()=>deleteCustomWorkout(activeCustomIndex);

list.appendChild(deleteButton);

}

document.getElementById("finishWorkoutButton")

.classList.remove("hidden");

}

/* =========================

   EXERCISE CARD

========================= */

function createExerciseCard(exercise,unique,index){

const card=document.createElement("div");

card.className="exercise";

const completed=

completedExercises.includes(unique);

card.innerHTML=`

<div class="exercise-header"

onclick="toggleDetails('${safeId(unique)}')">

<div class="exercise-title">

${escapeHTML(exercise.name)}

</div>

<div class="muscle">

${escapeHTML(exercise.muscle)}

</div>

</div>

<div class="details" id="${safeId(unique)}">

${exercise.image ?

`

<img

class="exercise-image"

src="${exercise.image}"

alt="${escapeHTML(exercise.name)}"

onerror="this.style.display='none';

this.nextElementSibling.style.display='flex';">

<div class="image-placeholder"

style="display:none">

Exercise picture coming soon

</div>

`

:

`

<div class="image-placeholder">

Exercise picture will be added to the library later

</div>

`}

<div class="detail-title">

How to Perform

</div>

<p>${escapeHTML(exercise.how)}</p>

<div class="detail-title">

Form Tips

</div>

<ul>

${(exercise.tips||[])

.map(x=>`<li>${escapeHTML(x)}</li>`)

.join("")}

</ul>

<div class="detail-title">

Common Mistakes

</div>

<ul>

${(exercise.mistakes||[])

.map(x=>`<li>${escapeHTML(x)}</li>`)

.join("")}

</ul>

<div class="tracking">

<strong>Track Your Sets</strong>

<div class="small">

Tap Weight or Reps and scroll to select.

</div>

${createSetRows(unique)}

<button

class="complete ${completed?"done":""}"

onclick="toggleComplete('${escapeAttribute(unique)}',this)">

${completed?"✓ Completed":"Mark Exercise Complete"}

</button>

</div>

</div>

`;

return card;

}

function toggleDetails(id){

const el=document.getElementById(id);

if(el)el.classList.toggle("open");

}

/* =========================

   SET TRACKING

========================= */

function createSetRows(unique){

let html="";

for(let set=1;set<=4;set++){

const key=unique+"-set"+set;

const current=

setHistory[key]||{weight:"",reps:""};

const previous=

previousHistory[key]||{weight:"",reps:""};

const currentWeight=

current.weight!==undefined && current.weight!==""

? `${current.weight} lb`

: "Weight";

const currentReps=

current.reps!==undefined && current.reps!==""

? `${current.reps} reps`

: "Reps";

let previousText="No previous workout";

if(

previous.weight!==undefined &&

previous.weight!=="" &&

previous.reps!==undefined &&

previous.reps!==""

){

previousText=

`Previous: ${previous.weight} lb × ${previous.reps}`;

}else if(

previous.weight!==undefined &&

previous.weight!==""

){

previousText=

`Previous: ${previous.weight} lb`;

}else if(

previous.reps!==undefined &&

previous.reps!==""

){

previousText=

`Previous: ${previous.reps} reps`;

}

html+=`

<div class="set-block">

<div class="set-row">

<span class="set-label">

Set ${set}

</span>

<button

class="picker-button"

id="${safeId(key+"-weight-button")}"

onclick="openPicker('${escapeAttribute(key)}','weight')">

${currentWeight}

</button>

<button

class="picker-button"

id="${safeId(key+"-reps-button")}"

onclick="openPicker('${escapeAttribute(key)}','reps')">

${currentReps}

</button>

</div>

<div class="previous">

${previousText}

</div>

</div>

`;

}

return html;

}

function saveSet(key,type,value){

if(!setHistory[key]){

setHistory[key]={weight:"",reps:""};

}

setHistory[key][type]=value;

localStorage.setItem(

"setHistoryV5",

JSON.stringify(setHistory)

);

}

/* =========================

   WHEEL PICKER

========================= */

let pickerKey=null;

let pickerType=null;

let pickerValues=[];

let pickerSelectedIndex=0;

function openPicker(key,type){

pickerKey=key;

pickerType=type;

const wheel=document.getElementById("wheel");

wheel.innerHTML="";

if(type==="weight"){

document.getElementById("pickerTitle")

.textContent="Select Weight";

pickerValues=[];

for(let i=0;i<=500;i+=5){

pickerValues.push(i);

}

}else{

document.getElementById("pickerTitle")

.textContent="Select Reps";

pickerValues=[];

for(let i=1;i<=50;i++){

pickerValues.push(i);

}

}

pickerValues.forEach(value=>{

const option=document.createElement("div");

option.className="wheel-option";

option.textContent=

type==="weight"

? `${value} lb`

: `${value} reps`;

wheel.appendChild(option);

});

const existing=

setHistory[key] &&

setHistory[key][type]!==undefined &&

setHistory[key][type]!==""

? Number(setHistory[key][type])

: null;

let index=0;

if(existing!==null){

const found=

pickerValues.indexOf(existing);

if(found>=0)index=found;

}

pickerSelectedIndex=index;

document.getElementById("pickerOverlay")

.classList.remove("hidden");

document.getElementById("pickerSheet")

.classList.remove("hidden");

requestAnimationFrame(()=>{

wheel.scrollTop=index*52;

});

}

function closePicker(){

document.getElementById("pickerOverlay")

.classList.add("hidden");

document.getElementById("pickerSheet")

.classList.add("hidden");

}

document.getElementById("wheel")

.addEventListener("scroll",()=>{

const wheel=document.getElementById("wheel");

const index=

Math.round(wheel.scrollTop/52);

pickerSelectedIndex=

Math.max(

0,

Math.min(index,pickerValues.length-1)

);

});

function confirmPicker(){

if(

pickerKey===null ||

pickerType===null ||

!pickerValues.length

){

closePicker();

return;

}

const value=

pickerValues[pickerSelectedIndex];

saveSet(

pickerKey,

pickerType,

value

);

const button=

document.getElementById(

safeId(

pickerKey+"-"+pickerType+"-button"

)

);

if(button){

button.textContent=

pickerType==="weight"

? `${value} lb`

: `${value} reps`;

}

closePicker();

}

/* =========================

   FINISH WORKOUT

========================= */

function finishWorkout(){

if(!activeWorkoutKey)return;

activeWorkoutExerciseIds.forEach(exerciseId=>{

for(let set=1;set<=4;set++){

const key=

activeWorkoutKey+

"-"+

exerciseId+

"-set"+

set;

if(setHistory[key]){

previousHistory[key]={

weight:

setHistory[key].weight ?? "",

reps:

setHistory[key].reps ?? ""

};

}

}

});

localStorage.setItem(

"previousHistoryV51",

JSON.stringify(previousHistory)

);

alert(

"Workout finished! Your sets are saved for comparison next time."

);

goHome();

}

/* =========================

   COMPLETION

========================= */

function toggleComplete(id,button){

if(completedExercises.includes(id)){

completedExercises=

completedExercises.filter(x=>x!==id);

button.textContent=

"Mark Exercise Complete";

button.classList.remove("done");

}else{

completedExercises.push(id);

button.textContent=

"✓ Completed";

button.classList.add("done");

}

localStorage.setItem(

"completedExercisesV5",

JSON.stringify(completedExercises)

);

updateProgress();

}

function updateProgress(){

const total=

Object.values(presetWorkouts)

.reduce(

(sum,w)=>sum+w.exercises.length,

0

);

const presetCompleted=

completedExercises.filter(

id=>id.startsWith("preset-")

).length;

const percent=

total

? Math.min((presetCompleted/total)*100,100)

:0;

document.getElementById("progressFill")

.style.width=percent+"%";

document.getElementById("progressText")

.textContent=

`${presetCompleted} of ${total} preset exercises completed`;

}

/* =========================

   LIBRARY

========================= */

function showLibrary(){

showScreen("libraryScreen");

renderLibrary();

}

function renderLibrary(){

const search=

document.getElementById("librarySearch")

.value.toLowerCase();

const muscle=

document.getElementById("muscleFilter").value;

const filtered=

exerciseLibrary.filter(ex=>{

const matchesSearch=

ex.name.toLowerCase().includes(search) ||

ex.muscle.toLowerCase().includes(search);

const matchesMuscle=

muscle==="All" ||

ex.muscle===muscle;

return matchesSearch && matchesMuscle;

});

const list=

document.getElementById("libraryList");

list.innerHTML="";

if(!filtered.length){

list.innerHTML=

`<div class="empty">

No exercises found.

</div>`;

return;

}

filtered.forEach(ex=>{

const row=document.createElement("div");

row.className="library-item";

row.innerHTML=`

<div>

<div class="library-name">

${escapeHTML(ex.name)}

</div>

<span class="badge">

${escapeHTML(ex.muscle)}

</span>

</div>

<button class="add-small">

View

</button>

`;

row.querySelector("button").onclick=

()=>viewLibraryExercise(ex.id);

list.appendChild(row);

});

}

function viewLibraryExercise(id){

const ex=getExercise(id);

if(!ex)return;

activeWorkoutKey="library";

activeWorkoutExerciseIds=[id];

showScreen("workoutScreen");

document.getElementById("workoutTitle")

.textContent=ex.name;

const list=

document.getElementById("exerciseList");

list.innerHTML="";

const card=

createExerciseCard(

ex,

"library-"+ex.id,

0

);

list.appendChild(card);

card.querySelector(".details")

.classList.add("open");

document.getElementById("finishWorkoutButton")

.classList.add("hidden");

}

/* =========================

   CUSTOM WORKOUT BUILDER

========================= */

function showBuilder(){

builderSelected=[];

document.getElementById("customWorkoutName")

.value="";

document.getElementById("builderSearch")

.value="";

showScreen("builderScreen");

renderBuilderSelected();

renderBuilderLibrary();

}

function renderBuilderLibrary(){

const search=

document.getElementById("builderSearch")

.value.toLowerCase();

const exercises=

exerciseLibrary.filter(ex=>

ex.name.toLowerCase().includes(search) ||

ex.muscle.toLowerCase().includes(search)

);

const list=

document.getElementById("builderLibrary");

list.innerHTML="";

exercises.forEach(ex=>{

const row=document.createElement("div");

row.className="library-item";

const already=

builderSelected.includes(ex.id);

row.innerHTML=`

<div>

<div class="library-name">

${escapeHTML(ex.name)}

</div>

<span class="badge">

${escapeHTML(ex.muscle)}

</span>

</div>

<button class="add-small">

${already?"Added ✓":"Add"}

</button>

`;

row.querySelector("button").onclick=

()=>addBuilderExercise(ex.id);

list.appendChild(row);

});

}

function addBuilderExercise(id){

if(!builderSelected.includes(id)){

builderSelected.push(id);

}

renderBuilderSelected();

renderBuilderLibrary();

}

function removeBuilderExercise(id){

builderSelected=

builderSelected.filter(x=>x!==id);

renderBuilderSelected();

renderBuilderLibrary();

}

function renderBuilderSelected(){

const area=

document.getElementById("builderExercises");

area.innerHTML="";

if(!builderSelected.length){

area.innerHTML=

`<div class="small">

No exercises added yet.

</div>`;

return;

}

builderSelected.forEach((id,index)=>{

const ex=getExercise(id);

if(!ex)return;

const item=document.createElement("div");

item.className="builder-exercise";

item.innerHTML=`

<strong>

${index+1}. ${escapeHTML(ex.name)}

</strong>

<span class="badge">

${escapeHTML(ex.muscle)}

</span>

<button

class="remove-small"

style="float:right">

Remove

</button>

`;

item.querySelector("button").onclick=

()=>removeBuilderExercise(id);

area.appendChild(item);

});

}

function saveCustomWorkout(){

const name=

document.getElementById("customWorkoutName")

.value.trim();

if(!name){

alert("Give your workout a name first.");

return;

}

if(!builderSelected.length){

alert("Add at least one exercise.");

return;

}

customWorkouts.push({

id:Date.now(),

name:name,

exercises:[...builderSelected]

});

localStorage.setItem(

"customWorkoutsV5",

JSON.stringify(customWorkouts)

);

goHome();

}

function deleteCustomWorkout(index){

const workout=

customWorkouts[index];

if(!workout)return;

const yes=

confirm(

`Delete "${workout.name}"?`

);

if(!yes)return;

customWorkouts.splice(index,1);

localStorage.setItem(

"customWorkoutsV5",

JSON.stringify(customWorkouts)

);

goHome();

}

/* =========================

   ESCAPE HELPERS

========================= */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}

function escapeAttribute(value){

return String(value)

.replaceAll("\\","\\\\")

.replaceAll("'","\\'");

}

function safeId(value){

return "id-"+String(value)

.replace(/[^a-zA-Z0-9_-]/g,"-");

}

/* =========================

   START

========================= */

renderHome();

updateProgress();

</script>

</body>

</html>
