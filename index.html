<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Workout Tracker">

<title>Workout Tracker</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

body {

    margin: 0;

    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;

    background: #f2f2f7;

    color: #111;

}

header {

    background: #111;

    color: white;

    padding: 22px 18px 18px;

    text-align: center;

}

header h1 {

    margin: 0;

    font-size: 28px;

}

header p {

    margin: 5px 0 0;

    color: #aaa;

}

.container {

    padding: 16px;

    max-width: 700px;

    margin: auto;

}

.day-button {

    width: 100%;

    border: none;

    background: white;

    border-radius: 16px;

    padding: 18px;

    margin-bottom: 12px;

    text-align: left;

    font-size: 18px;

    font-weight: 700;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);

    cursor: pointer;

}

.day-button span {

    display: block;

    font-size: 14px;

    color: #777;

    margin-top: 5px;

    font-weight: 400;

}

.exercise {

    background: white;

    border-radius: 18px;

    margin-bottom: 14px;

    overflow: hidden;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);

}

.exercise-header {

    padding: 16px;

    cursor: pointer;

}

.exercise-title {

    font-size: 19px;

    font-weight: 700;

}

.muscle {

    display: inline-block;

    margin-top: 7px;

    padding: 5px 9px;

    border-radius: 8px;

    background: #eee;

    color: #555;

    font-size: 13px;

}

.details {

    display: none;

    padding: 0 16px 18px;

    border-top: 1px solid #eee;

}

.details.open {

    display: block;

}

.exercise-image {

    width: 100%;

    height: 220px;

    background: #e8e8ed;

    border-radius: 14px;

    margin: 16px 0;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #777;

    text-align: center;

    padding: 20px;

}

.section-title {

    font-size: 16px;

    font-weight: 700;

    margin-top: 16px;

    margin-bottom: 7px;

}

.details p,

.details li {

    color: #444;

    line-height: 1.5;

    font-size: 15px;

}

.details ul {

    padding-left: 20px;

}

.tracking {

    background: #f7f7f9;

    border-radius: 14px;

    padding: 12px;

    margin-top: 15px;

}

.set-row {

    display: flex;

    gap: 8px;

    align-items: center;

    margin-bottom: 8px;

}

.set-row span {

    width: 45px;

    font-weight: 600;

}

.set-row input {

    width: 100%;

    padding: 10px;

    border: 1px solid #ccc;

    border-radius: 9px;

    font-size: 16px;

}

.complete {

    width: 100%;

    border: none;

    border-radius: 11px;

    padding: 12px;

    background: #111;

    color: white;

    font-weight: 700;

    font-size: 15px;

    margin-top: 5px;

}

.back {

    border: none;

    background: transparent;

    font-size: 17px;

    font-weight: 600;

    padding: 5px 0 15px;

    cursor: pointer;

}

.hidden {

    display: none;

}

.progress {

    background: white;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 16px;

}

.progress-bar {

    height: 10px;

    background: #ddd;

    border-radius: 10px;

    overflow: hidden;

}

.progress-fill {

    height: 100%;

    width: 0%;

    background: #111;

    transition: width .3s;

}

.small {

    color: #777;

    font-size: 13px;

}

</style>

</head>

<body>

<header>

    <h1>Workout Tracker</h1>

    <p>Version 4</p>

</header>

<div class="container">

    <!-- HOME -->

    <div id="home">

        <div class="progress">

            <strong>Workout Progress</strong>

            <p class="small" id="progressText">0 exercises completed</p>

            <div class="progress-bar">

                <div class="progress-fill" id="progressFill"></div>

            </div>

        </div>

        <button class="day-button" onclick="openWorkout('day1')">

            Day 1 — Chest & Triceps

            <span>Chest, shoulders and triceps</span>

        </button>

        <button class="day-button" onclick="openWorkout('day2')">

            Day 2 — Back & Biceps

            <span>Back, lats and biceps</span>

        </button>

        <button class="day-button" onclick="openWorkout('day3')">

            Day 3 — Legs

            <span>Quads, hamstrings and calves</span>

        </button>

        <button class="day-button" onclick="openWorkout('day4')">

            Day 4 — Shoulders & Arms

            <span>Shoulders, biceps and triceps</span>

        </button>

    </div>

    <!-- WORKOUT -->

    <div id="workout" class="hidden">

        <button class="back" onclick="goHome()">← Back</button>

        <h2 id="workoutTitle"></h2>

        <div id="exerciseList"></div>

    </div>

</div>

<script>

const workouts = {

day1: {

    title: "Day 1 — Chest & Triceps",

    exercises: [

        {

            name: "Machine Chest Press",

            muscle: "Chest",

            image: "Machine Chest Press",

            how: "Sit with your back flat against the pad. Adjust the seat so the handles are around mid-chest height. Grip the handles and press them forward until your arms are almost straight. Slowly return the handles until you feel a comfortable stretch in your chest.",

            tips: [

                "Keep your back against the pad.",

                "Keep your wrists straight.",

                "Control the weight instead of letting it slam back.",

                "Do not lock your elbows aggressively."

            ],

            mistakes: [

                "Using momentum.",

                "Bouncing the weight.",

                "Letting the shoulders roll forward.",

                "Using more weight than you can control."

            ]

        },

        {

            name: "Pec Deck",

            muscle: "Chest",

            image: "Pec Deck",

            how: "Sit with your back against the pad. Place your arms against the machine pads or grip the handles. Bring your arms together in front of your chest while keeping a slight bend in your elbows. Slowly return to the starting position.",

            tips: [

                "Keep your chest up.",

                "Move through a controlled range of motion.",

                "Squeeze your chest when your hands come together."

            ],

            mistakes: [

                "Moving too quickly.",

                "Using your shoulders to swing the weight.",

                "Going too heavy."

            ]

        },

        {

            name: "Triceps Pushdown",

            muscle: "Triceps",

            image: "Cable Triceps Pushdown",

            how: "Stand facing the cable machine. Hold the attachment with your elbows close to your sides. Push the handle downward until your arms are almost straight. Slowly return the handle while keeping your upper arms stationary.",

            tips: [

                "Keep your elbows tucked.",

                "Only your forearms should move.",

                "Squeeze your triceps at the bottom."

            ],

            mistakes: [

                "Swinging your body.",

                "Moving your elbows forward.",

                "Using momentum."

            ]

        }

    ]

},

day2: {

    title: "Day 2 — Back & Biceps",

    exercises: [

        {

            name: "Lat Pulldown",

            muscle: "Lats / Back",

            image: "Lat Pulldown",

            how: "Sit down and secure your legs under the pads. Grab the bar slightly wider than shoulder width. Pull the bar toward your upper chest while driving your elbows down. Slowly allow the bar to return upward.",

            tips: [

                "Keep your chest up.",

                "Pull with your elbows.",

                "Control the weight on the way up."

            ],

            mistakes: [

                "Pulling the bar behind your neck.",

                "Swinging backward.",

                "Using momentum."

            ]

        },

        {

            name: "Seated Row Machine",

            muscle: "Mid Back",

            image: "Seated Row Machine",

            how: "Sit upright with your chest against the pad if your machine has one. Grip the handles and pull them toward your torso. Squeeze your shoulder blades together, then slowly extend your arms.",

            tips: [

                "Keep your chest supported.",

                "Pull your elbows back.",

                "Keep the movement controlled."

            ],

            mistakes: [

                "Shrugging your shoulders.",

                "Rounding your back.",

                "Jerking the weight."

            ]

        },

        {

            name: "Preacher Curl Machine",

            muscle: "Biceps",

            image: "Preacher Curl Machine",

            how: "Position your upper arms against the pad and grip the handles. Curl the weight upward without lifting your upper arms from the pad. Lower the weight slowly until your arms are nearly straight.",

            tips: [

                "Keep your upper arms planted.",

                "Use a slow lowering phase.",

                "Squeeze your biceps at the top."

            ],

            mistakes: [

                "Lifting your elbows.",

                "Dropping the weight quickly.",

                "Using excessive weight."

            ]

        }

    ]

},

day3: {

    title: "Day 3 — Legs",

    exercises: [

        {

            name: "Leg Press",

            muscle: "Quads / Glutes",

            image: "Leg Press",

            how: "Place your feet on the platform around shoulder width apart. Release the safety handles and lower the platform by bending your knees. Lower until you reach a comfortable depth while keeping your lower back against the pad. Press the platform back up.",

            tips: [

                "Keep your feet planted.",

                "Keep your knees tracking in line with your toes.",

                "Control the descent."

            ],

            mistakes: [

                "Allowing your knees to collapse inward.",

                "Rounding your lower back.",

                "Locking your knees aggressively."

            ]

        },

        {

            name: "Leg Extension",

            muscle: "Quadriceps",

            image: "Leg Extension",

            how: "Sit against the back pad and place your ankles behind the roller. Extend your legs until they are nearly straight. Pause briefly and squeeze your quads, then lower the weight slowly.",

            tips: [

                "Keep your hips against the seat.",

                "Use controlled movement.",

                "Focus on squeezing the quads."

            ],

            mistakes: [

                "Kicking the weight.",

                "Using momentum.",

                "Dropping the weight quickly."

            ]

        },

        {

            name: "Seated Leg Curl",

            muscle: "Hamstrings",

            image: "Seated Leg Curl",

            how: "Sit with your back against the pad and place your lower legs against the roller. Curl your heels downward and underneath the seat as far as comfortably possible. Slowly return to the starting position.",

            tips: [

                "Keep your hips against the pad.",

                "Control the return.",

                "Squeeze your hamstrings."

            ],

            mistakes: [

                "Lifting your hips.",

                "Using momentum.",

                "Moving too quickly."

            ]

        },

        {

            name: "Calf Raise Machine",

            muscle: "Calves",

            image: "Calf Raise Machine",

            how: "Position the balls of your feet on the platform with your heels hanging off. Lower your heels for a controlled stretch, then push through the balls of your feet and raise your heels as high as comfortably possible.",

            tips: [

                "Use a full range of motion.",

                "Pause briefly at the top.",

                "Control the stretch at the bottom."

            ],

            mistakes: [

                "Bouncing at the bottom.",

                "Using very short repetitions.",

                "Moving too quickly."

            ]

        }

    ]

},

day4: {

    title: "Day 4 — Shoulders & Arms",

    exercises: [

        {

            name: "Shoulder Press Machine",

            muscle: "Shoulders",

            image: "Shoulder Press Machine",

            how: "Adjust the seat so the handles start around shoulder height. Sit with your back against the pad. Press the handles upward until your arms are nearly straight, then slowly lower them back down.",

            tips: [

                "Keep your back against the pad.",

                "Keep your wrists straight.",

                "Control the lowering phase."

            ],

            mistakes: [

                "Arching your lower back excessively.",

                "Using momentum.",

                "Dropping the weight."

            ]

        },

        {

            name: "Lateral Raise Machine",

            muscle: "Side Delts",

            image: "Lateral Raise Machine",

            how: "Sit upright and position your arms against the machine pads. Raise your arms outward until approximately shoulder height. Slowly lower them back down.",

            tips: [

                "Use controlled repetitions.",

                "Focus on the side of your shoulders.",

                "Avoid shrugging."

            ],

            mistakes: [

                "Using momentum.",

                "Shrugging your shoulders.",

                "Going excessively heavy."

            ]

        },

        {

            name: "Biceps Curl Machine",

            muscle: "Biceps",

            image: "Biceps Curl Machine",

            how: "Place your upper arms against the machine pad and grip the handles. Curl the handles upward while keeping your upper arms stationary. Slowly lower the weight back down.",

            tips: [

                "Keep your elbows planted.",

                "Squeeze your biceps at the top.",

                "Lower the weight slowly."

            ],

            mistakes: [

                "Lifting your elbows.",

                "Swinging the weight.",

                "Using momentum."

            ]

        },

        {

            name: "Triceps Extension Machine",

            muscle: "Triceps",

            image: "Triceps Extension Machine",

            how: "Sit with your back against the pad and place your arms against the machine's pads or handles. Extend your arms against the resistance until nearly straight. Slowly return to the starting position.",

            tips: [

                "Keep your shoulders stable.",

                "Focus on extending through the elbows.",

                "Use controlled repetitions."

            ],

            mistakes: [

                "Moving your shoulders excessively.",

                "Using momentum.",

                "Going too heavy."

            ]

        }

    ]

}

};

let completedExercises =

    JSON.parse(localStorage.getItem("completedExercises") || "[]");

function openWorkout(day) {

    document.getElementById("home").classList.add("hidden");

    document.getElementById("workout").classList.remove("hidden");

    const workout = workouts[day];

    document.getElementById("workoutTitle").textContent =

        workout.title;

    const list = document.getElementById("exerciseList");

    list.innerHTML = "";

    workout.exercises.forEach((exercise, index) => {

        const id = day + "-" + index;

        const card = document.createElement("div");

        card.className = "exercise";

        card.innerHTML = `

            <div class="exercise-header"

                 onclick="toggleExercise('${id}')">

                <div class="exercise-title">

                    ${exercise.name}

                </div>

                <div class="muscle">

                    ${exercise.muscle}

                </div>

            </div>

            <div class="details" id="${id}">

                <div class="exercise-image">

                    <div>

                        <strong>Exercise Demonstration</strong>

                        <br><br>

                        ${exercise.image}

                        <br><br>

                        <span class="small">

                        Exercise image will appear here

                        </span>

                    </div>

                </div>

                <div class="section-title">

                    How to Perform

                </div>

                <p>

                    ${exercise.how}

                </p>

                <div class="section-title">

                    Form Tips

                </div>

                <ul>

                    ${exercise.tips.map(tip =>

                        `<li>${tip}</li>`

                    ).join("")}

                </ul>

                <div class="section-title">

                    Common Mistakes

                </div>

                <ul>

                    ${exercise.mistakes.map(mistake =>

                        `<li>${mistake}</li>`

                    ).join("")}

                </ul>

                <div class="tracking">

                    <strong>Track Your Sets</strong>

                    <div class="set-row">

                        <span>Set 1</span>

                        <input type="number"

                               placeholder="Weight">

                        <input type="number"

                               placeholder="Reps">

                    </div>

                    <div class="set-row">

                        <span>Set 2</span>

                        <input type="number"

                               placeholder="Weight">

                        <input type="number"

                               placeholder="Reps">

                    </div>

                    <div class="set-row">

                        <span>Set 3</span>

                        <input type="number"

                               placeholder="Weight">

                        <input type="number"

                               placeholder="Reps">

                    </div>

                    <div class="set-row">

                        <span>Set 4</span>

                        <input type="number"

                               placeholder="Weight">

                        <input type="number"

                               placeholder="Reps">

                    </div>

                    <button class="complete"

                            onclick="completeExercise('${id}', this)">

                        ${completedExercises.includes(id)

                            ? "✓ Completed"

                            : "Mark Exercise Complete"}

                    </button>

                </div>

            </div>

        `;

        list.appendChild(card);

    });

}

function toggleExercise(id) {

    const element = document.getElementById(id);

    element.classList.toggle("open");

}

function completeExercise(id, button) {

    if (!completedExercises.includes(id)) {

        completedExercises.push(id);

        button.textContent = "✓ Completed";

    } else {

        completedExercises =

            completedExercises.filter(item => item !== id);

        button.textContent =

            "Mark Exercise Complete";

    }

    localStorage.setItem(

        "completedExercises",

        JSON.stringify(completedExercises)

    );

    updateProgress();

}

function updateProgress() {

    const total = Object.values(workouts)

        .reduce((sum, day) => sum + day.exercises.length, 0);

    const completed = completedExercises.length;

    const percentage =

        Math.min((completed / total) * 100, 100);

    document.getElementById("progressFill")

        .style.width = percentage + "%";

    document.getElementById("progressText")

        .textContent =

        completed + " of " + total +

        " exercises completed";

}

function goHome() {

    document.getElementById("workout")

        .classList.add("hidden");

    document.getElementById("home")

        .classList.remove("hidden");

    updateProgress();

}

updateProgress();

</script>

</body>

</html>
