name: LIFTOVA Browser Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exercise each Liftova screen twice
        run: node tests/liftova-browser-smoke.cjs
      - name: Validate expanded Free food catalog
        run: node tests/myliftcoach-free-food-catalog.cjs
      - name: Verify meal cloud snapshots and account ownership guards
        run: node tests/myliftcoach-meal-cloud-serialization.cjs
      - name: Exercise Food Planner and Custom Schedule Release
        run: node tests/myliftcoach-food-schedule-release.cjs
      - name: Verify linked custom workout edit and deletion schedule
        run: node tests/myliftcoach-weekly-custom-sync.cjs
      - name: Exercise MYLIFTCOACH workout lifecycle
        run: node tests/myliftcoach-workout-lifecycle.cjs
      - name: Exercise goal to program changes and reload
        run: node tests/myliftcoach-goal-program.cjs
      - name: Exercise MYLIFTCOACH substitution navigation and summary
        run: node tests/myliftcoach-substitution-summary.cjs
      - name: Exercise MYLIFTCOACH Progress History Records Calendar
        run: node tests/myliftcoach-progress-history-calendar.cjs
      - name: Exercise MYLIFTCOACH daily tracking
        run: node tests/myliftcoach-daily-tracking.cjs
      - name: Exercise MYLIFTCOACH profile settings backup help and timer
        run: node tests/myliftcoach-settings-tools.cjs
      - name: Exercise MYLIFTCOACH onboarding flow
        run: node tests/myliftcoach-onboarding-flow.cjs
      - name: Exercise MYLIFTCOACH final tester readiness
        run: node tests/myliftcoach-final-readiness.cjs
      - name: Exercise MYLIFTCOACH startup recovery
        run: node tests/myliftcoach-startup-recovery.cjs
      - name: Exercise MYLIFTCOACH iPhone Home startup
        run: node tests/myliftcoach-home-startup.cjs
      - name: Capture luxury first-launch iPhone screenshot
        run: node tests/luxury-first-paint.cjs
      - name: Upload luxury first-launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-iphone-first-launch
          path: artifacts/luxury-preview/*.png
          if-no-files-found: warn
