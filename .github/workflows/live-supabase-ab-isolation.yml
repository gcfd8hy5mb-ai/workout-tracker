name: Live Supabase A-B Isolation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate live authenticated A/B isolation
        env:
          MYLIFTCOACH_TEST_A_EMAIL: ${{ secrets.MYLIFTCOACH_TEST_A_EMAIL }}
          MYLIFTCOACH_TEST_A_PASSWORD: ${{ secrets.MYLIFTCOACH_TEST_A_PASSWORD }}
          MYLIFTCOACH_TEST_B_EMAIL: ${{ secrets.MYLIFTCOACH_TEST_B_EMAIL }}
          MYLIFTCOACH_TEST_B_PASSWORD: ${{ secrets.MYLIFTCOACH_TEST_B_PASSWORD }}
        run: node tests/live-supabase-ab-isolation.cjs
