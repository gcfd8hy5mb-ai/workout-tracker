name: MYLIFTCOACH 2.0 Migration Verification
on:
  push:
    branches:
      - 'feature/myliftcoach2-*'
  pull_request:
    paths:
      - 'myliftcoach2/**'
      - 'tests/test_myliftcoach2_*.cjs'
      - '.github/workflows/myliftcoach2-verify.yml'
      - '.github/workflows/myliftcoach2-postgres-integration.yml'
      - 'docs/sql/**'
      - 'tests/fixtures/**'
      - 'tests/run_v2_postgres_integration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check imported JavaScript syntax
        run: |
          set -euo pipefail
          for source in myliftcoach2/*.js; do
            echo "Checking $source"
            node --check "$source"
          done
      - name: Run staged migration regression suite
        run: node --test tests/test_myliftcoach2_*.cjs
      - name: Verify preview script links resolve
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources=[]
              def handle_starttag(self,tag,attrs):
                  if tag == 'script':
                      source=dict(attrs).get('src')
                      if source:
                          self.sources.append(source.split('?')[0])
          html=Path('myliftcoach2/index.html')
          parser=Scripts()
          parser.feed(html.read_text())
          missing=[src for src in parser.sources if not (html.parent/src).is_file()]
          if missing:
              raise SystemExit('Missing scripts: '+', '.join(missing))
          print(f'{len(parser.sources)} preview script references found and verified')
          PY

  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare mock auth roles in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/fixtures/v2-test-auth.sql
      - name: Validate draft SQL in temporary DB only
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f docs/sql/prism-v2-isolated-schedule.DRAFT.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f docs/sql/prism-v2-private-rpc.DRAFT.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f docs/sql/prism-v2-owner-hardening.DRAFT.sql
      - name: Run two-user and concurrent transaction SQL tests
        run: python3 tests/run_v2_postgres_integration.py
      - name: Prepare disposable HTTP authenticator
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/fixtures/v2-postgrest-auth.sql
      - name: Start local PostgREST HTTP API with test-only JWT secret
        env:
          V2_TEST_JWT_SECRET: local-postgrest-only-strong-secret-000001
        run: |
          docker run -d --name v2-http-test --network host \
            -e PGRST_DB_URI='postgres://v2_http_authenticator:ephemeral-ci-authenticator@127.0.0.1:5432/postgres' \
            -e PGRST_DB_ANON_ROLE='anon' \
            -e PGRST_DB_SCHEMAS='public' \
            -e PGRST_JWT_SECRET="$V2_TEST_JWT_SECRET" \
            -e PGRST_SERVER_PORT='3000' \
            postgrest/postgrest:v14.18
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs v2-http-test
          exit 1
      - name: Exercise actual HTTP RPC with signed JWTs
        env:
          V2_TEST_JWT_SECRET: local-postgrest-only-strong-secret-000001
        run: python3 tests/run_v2_postgrest_http.py


  browser-workout-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Start local development preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/myliftcoach2-browser-server.log 2>&1 &
      - name: Check schedule and restored Coach flows in Chromium
        run: |
          node tests/run_myliftcoach2_browser_schedule.cjs
          node tests/run_myliftcoach2_browser_coach.cjs
