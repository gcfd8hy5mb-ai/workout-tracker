name: Test and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/test_*.js)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No JavaScript regression tests found."
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "Running $test_file"
            node "$test_file"
          done

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
