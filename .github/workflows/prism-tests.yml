name: PRISM Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prism-regression:
    name: PRISM Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PRISM
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run PRISM regression tests
        run: node tests/prism-regression.test.js
      - name: Run LIFTOVA adaptive feedback confidence tests
        run: node tests/test_adaptive_feedback_confidence.js
      - name: Run LIFTOVA adaptive feedback quality tests
        run: node tests/test_adaptive_feedback_quality.js
      - name: Run LIFTOVA adaptive feedback explainability tests
        run: node tests/test_adaptive_feedback_explainability.js
      - name: Run LIFTOVA Coach decision audit tests
        run: node tests/test_adaptive_feedback_decision_audit.js
      - name: Run LIFTOVA Athlete Learning Engine tests
        run: node tests/test_athlete_learning_engine.js
      - name: Run LIFTOVA adaptive 6-week simulation
        run: node tests/test_adaptive_6_week_simulation.js
      - name: Run LIFTOVA adaptive 12-week adversarial simulation
        run: node tests/test_adaptive_12_week_adversarial.js
      - name: Run LIFTOVA Athlete Learning 16/20-week simulations
        run: node tests/test_athlete_learning_long_simulation.js
