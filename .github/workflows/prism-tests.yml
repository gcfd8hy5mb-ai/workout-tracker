name: PRISM Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prism-regression:
    name: PRISM Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PRISM
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run PRISM regression tests
        run: node tests/prism-regression.test.js
      - name: Run Coach decision simulations
        run: node tests/coach-decision-simulation.test.js
