name: Luxury isolated authentication
on:
  push:
    branches:
      - design/luxury-marble-teal-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate saved-session redirect behavior
        run: node tests/luxury-session-redirect.cjs
      - name: Verify private account gate requires identity confirmation
        run: node tests/luxury-account-gate.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify login-to-account handoff without heavyweight startup
        run: node tests/luxury-isolated-auth.cjs
