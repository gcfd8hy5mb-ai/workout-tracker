name: Luxury isolated authentication
on:
  push:
    branches:
      - design/luxury-marble-teal-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate no session redirect loop
        run: node tests/luxury-auth-no-redirect-loop.cjs
      - name: Verify private account gate requires identity confirmation
        run: node tests/luxury-account-gate.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify real integrated iPhone startup and visible sign-in
        run: node tests/luxury-integrated-startup.cjs
