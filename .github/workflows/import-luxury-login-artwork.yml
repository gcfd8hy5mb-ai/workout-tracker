name: Import approved luxury login artwork
on:
  push:
    branches: [design/luxury-marble-teal-20261018]
    paths: ['.github/workflows/import-luxury-login-artwork.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/luxury-marble-teal-20261018
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Download original generated design and extract photographic branding
        env:
          SOURCE_URL: https://9bfbc956-4679-43fe-88d4-220af901697c.sandbox.floot.app/_cdn/static/53c79102-7601-4aca-85a1-ad3559bb02ac-approved-login-render.png
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 "$SOURCE_URL" -o /tmp/approved-login-render.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('/tmp/approved-login-render.png').convert('RGB')
          w,h=im.size
          print('Artwork source:',w,h)
          # Only the brand artwork is baked into the image; form controls remain live.
          brand=im.crop((int(w*.065),int(h*.108),int(w*.935),int(h*.395)))
          brand.thumbnail((850,680),Image.Resampling.LANCZOS)
          Path('images').mkdir(exist_ok=True)
          brand.save('images/myliftcoach-luxury-brand.webp','WEBP',quality=91,method=6)
          print('Wrote',Path('images/myliftcoach-luxury-brand.webp').stat().st_size,'bytes')
          PY
      - name: Commit image asset to redesign branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/myliftcoach-luxury-brand.webp
          if ! git diff --cached --quiet; then git commit -m "Add approved photorealistic luxury brand artwork"; git push origin HEAD:design/luxury-marble-teal-20261018; fi
