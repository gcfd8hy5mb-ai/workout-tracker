name: MYLIFTCOACH 2.0 Disposable Postgres Tests
on:
  push:
    branches:
      - 'feature/myliftcoach2-postgres-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary auth schema and roles
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/fixtures/v2-test-auth.sql
      - name: Apply draft SQL to throwaway database ONLY
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f docs/sql/prism-v2-isolated-schedule.DRAFT.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f docs/sql/prism-v2-private-rpc.DRAFT.sql
      - name: Test owner isolation, permissions, stale CAS, and two clients
        run: python3 tests/run_v2_postgres_integration.py
