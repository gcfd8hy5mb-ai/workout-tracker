<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003b49">
<title>MYLIFTCOACH — Opening Workout Dashboard</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#003b49;color:#fff4df;font:15px -apple-system,BlinkMacSystemFont,sans-serif}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#003b49;visibility:hidden}
#launch{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;background:linear-gradient(#003b49f5,#002b36f7),url('images/luxury-teal-marble.svg?v=2') center/cover}
#launch .panel{width:min(100%,390px);padding:32px 20px;border:1px solid #c9a16a;border-radius:24px;background:#002630e8}
h1{font:400 32px Georgia,serif;margin:0 0 15px}
#stage{color:#d5eee6;line-height:1.5;min-height:3em}
p{font-size:13px;line-height:1.5;color:#c2d7d6}
a,button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:8px;padding:10px 16px;border:1px solid #c9a16a;border-radius:13px;color:#fff0ce;background:#005e69;font:600 15px -apple-system,sans-serif;text-decoration:none}
#actions{display:none}
#appFrame.ready{visibility:visible}
#launch.done{display:none}
</style></head><body>
<iframe id="appFrame" title="MYLIFTCOACH workout dashboard" src="app.html" referrerpolicy="same-origin"></iframe>
<div id="launch" role="status" aria-live="polite"><div class="panel"><h1>MYLIFTCOACH</h1>
<div id="stage">Opening your secure training dashboard…</div>
<p id="detail">Checking that the workout page loads before showing it.</p>
<div id="actions"><button id="retry" type="button">Try again</button><a href="preview-login.html?retry=1">Return to sign-in</a></div>
</div></div>
<script>
(function(){
'use strict';
const frame=document.getElementById('appFrame'),launch=document.getElementById('launch');
const stage=document.getElementById('stage'),detail=document.getElementById('detail'),actions=document.getElementById('actions');
let loaded=false,done=false,failed=false,last='Waiting for the workout document';
const fail=(reason)=>{if(done||failed)return;failed=true;stage.textContent='The dashboard did not finish opening';detail.textContent=reason+' — Your saved workout data has not been cleared.';actions.style.display='block'};
const retry=document.getElementById('retry');
retry.onclick=()=>location.reload();
frame.onload=()=>{loaded=true;last='Workout document loaded';if(!failed)stage.textContent='Workout document loaded. Verifying your account…'};
frame.onerror=()=>fail('The workout document could not load');
const timer=setInterval(()=>{
 if(done||failed){clearInterval(timer);return}
 let doc,win;
 try{doc=frame.contentDocument;win=frame.contentWindow;if(!doc||!win)return}catch(_){fail('The workout frame was blocked');return}
 if(doc.readyState==='complete'&&!loaded){loaded=true;last='Workout document parsed'}
 if(win.MYLIFTCOACHStartupTrace?.events?.length)last='Last startup event: '+win.MYLIFTCOACHStartupTrace.events.slice(-1)[0].name;
 if(doc.documentElement?.classList.contains('prism-account-booting')){last='Waiting for Supabase account verification';return}
 const gate=doc.getElementById('liftovaAuthGate');
 if(gate){fail('The workout app returned to its login gate instead of opening the dashboard');return}
 const selectors=['#home:not(.hidden) .liftova-home-shell','#welcomeScreen:not(.hidden)','#onboardingScreen:not(.hidden)','#goalReviewScreen:not(.hidden)','#workoutsScreen:not(.hidden)','#workoutScreen:not(.hidden)'];
 const ready=selectors.some(q=>{const el=doc.querySelector(q);return el&&win.getComputedStyle(el).visibility!=='hidden'&&win.getComputedStyle(el).display!=='none'});
 if(ready){
  done=true;frame.classList.add('ready');launch.classList.add('done');clearInterval(timer);
 }
},500);
setTimeout(()=>{if(!done)fail((loaded?'Workout page loaded but dashboard remained hidden. ':'Workout page did not report loading. ')+last)},15000);
})();
</script>
</body></html>
