<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYLIFTCOACH startup check</title><style>body{margin:0;background:#003b49;color:#fff9e8;font:16px -apple-system,sans-serif;padding:35px 22px}main{max-width:480px;margin:auto}h1{font:32px Georgia,serif}p{line-height:1.5}li{margin:13px 0}a{display:block;background:#047684;color:white;border:1px solid #bd9e74;border-radius:13px;padding:16px;text-align:center;font-weight:700;text-decoration:none;margin-top:25px}#result{background:#002c35;border-radius:12px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>MYLIFTCOACH</h1><p>Startup check — no password or workout data is read by this page.</p><div id="result">Checking preview files…</div><a href="./app.html">Open workout app directly</a></main><script>(async()=>{let out=[];for(const path of ['app.html','persistence/storage-model.js','persistence/scoped-storage.js','persistence/account-ui.js']){try{const r=await fetch(path,{cache:'no-store'}),t=await r.text();out.push(path+': '+r.status+' / '+(path==='app.html'?(t.includes('PRISMScopedStorage.create(window.localStorage)')?'workout document':'WRONG DOCUMENT'):(t.includes('<!doctype')?'HTML INSTEAD OF SCRIPT':'script response')))}catch(e){out.push(path+': '+e.message)}}document.getElementById('result').textContent=out.join('\n')})()</script></body></html>
