<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003b49">
<title>MYLIFTCOACH — Sign In</title>
<style>
*{box-sizing:border-box}
html{background:#002e3a}
body{margin:0;min-height:100dvh;color:#f8edda;background:#002e3a url('images/luxury-teal-marble.svg?v=2') center/cover fixed;font-family:Georgia,'Times New Roman',serif}
main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.shell{width:min(100%,440px)}
.brand{width:100%;height:clamp(145px,29vh,245px);background:url('images/myliftcoach-luxury-brand.webp') center/contain no-repeat;filter:drop-shadow(0 8px 16px #001b23)}
.tagline{text-align:center;letter-spacing:.25em;text-transform:uppercase;font-size:11px;color:#f2dcb3;margin:4px 0 20px}
.card{border:1.5px solid #c9a16a;border-radius:27px;padding:25px clamp(16px,5vw,25px);background:linear-gradient(115deg,rgba(0,29,38,.94),rgba(0,18,27,.96));box-shadow:0 24px 58px #00131caa}
h1{font-size:clamp(30px,7vw,39px);font-weight:400;text-align:center;color:#fff0d6;margin:0 0 10px}
.sub{text-align:center;color:#ede3d1;font-size:15px;margin:0 0 22px;line-height:1.45}
label{display:block;color:#f3deb9;font-size:12px;letter-spacing:.15em;margin:16px 0 8px}
input{display:block;width:100%;border:1.2px solid #c9a16a;border-radius:15px;background:#001b25;color:#fff9e9;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:16px;min-height:54px;outline:none}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #4edfe3;outline-offset:3px}
.password{display:flex;align-items:center;position:relative}.password input{padding-right:90px}
.show{position:absolute;right:7px;border:0;border-radius:10px;background:#005969;color:#fff1d6;min-height:40px;padding:0 12px}
.primary{width:100%;margin-top:24px;min-height:58px;border-radius:15px;border:1.5px solid #d5af70;background:linear-gradient(120deg,#003b49,#007480);color:#fff3df;font:500 20px Georgia,serif;letter-spacing:.13em}
.primary:disabled{opacity:.62}
.links{display:flex;justify-content:center;gap:20px;margin-top:17px;flex-wrap:wrap}
.links button{background:none;border:0;color:#ffe4b4;text-decoration:underline;text-underline-offset:5px;font:15px Georgia,serif;padding:12px}
#status{min-height:2.7em;text-align:center;margin:18px 0 2px;line-height:1.5;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#e9ddd0;overflow-wrap:anywhere}
#status[data-error=true]{color:#ff9fad}
.small{text-align:center;line-height:1.5;color:#becfca;font-size:12px;margin:14px 0 0}
#continue{display:none;text-align:center;color:#fff0c9;padding:12px;font-size:16px}
@media(max-width:390px){.card{padding:20px 16px}.tagline{font-size:10px}.brand{height:150px}}
</style>
</head>
<body>
<main><div class="shell"><div class="brand" role="img" aria-label="MYLIFTCOACH luxury brand"></div><div class="tagline">Train · Track · Progress</div>
<div class="card">
<h1>Welcome back</h1><p class="sub">Sign in to continue your training.</p>
<form id="loginForm">
<label for="email">EMAIL</label><input id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
<label for="password">PASSWORD</label><div class="password"><input id="password" type="password" autocomplete="current-password" minlength="6" required><button class="show" id="toggle" type="button">Show</button></div>
<button id="submit" class="primary" type="submit">SIGN IN →</button>
</form>
<div class="links"><button type="button" id="reset">Forgot password?</button></div>
<p id="status" role="status" aria-live="polite"></p>
<a id="continue" href="app.html">Continue to my account →</a>
<p class="small">Your training data stays with your MYLIFTCOACH account.</p>
</div></div></main>
<script src="preview-login.js?v=1"></script>
</body></html>
